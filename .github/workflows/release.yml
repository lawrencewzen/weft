name: release

on:
  workflow_dispatch:
  push:
    tags:
      # 解压即用的 Windows 包是内网版的发布物，从 intranet 分支打 tag。
      - "intranet-v*"
  # workflow_dispatch is only listed once this file is on the default branch.
  # Pull requests that touch the packer still build the zip so the package can
  # be proven before it reaches main. Unrelated PRs do not run this job.
  pull_request:
    branches: [main, intranet]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/pack-release.mjs"
      - "scripts/build-installer.mjs"
      - "desktop/**"
      - "tests/unit/pack-release.test.mjs"
      - "tests/unit/build-installer.test.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  win-x64:
    name: win-x64
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: write
    steps:
      # Defender real-time scanning dominates npm ci / zip time on the runner (tens of thousands of small files).
      - name: Exclude build dirs from Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE, (Join-Path $env:LOCALAPPDATA 'npm-cache') -ErrorAction Stop
            Write-Host 'defender exclusions added'
          } catch { Write-Host "defender exclusion skipped: $_" }

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Publish desktop shell (.NET 8, self-contained, single file)
        run: dotnet publish desktop/win -c Release -o desktop/win/publish

      - name: Cache WebView2 cab
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/webview2.cab
          # The cab is pinned by SHA256 below; bump the key together with WEBVIEW2_SHA256.
          key: webview2-cab-0ac7317a08c3f3beebbb9b6d90f5b77352569f0a33a54a15ef6aaabc82899b7c

      - name: Add WebView2 Fixed Version Runtime
        shell: pwsh
        env:
          WEBVIEW2_VERSION: "157.0.4341.46"
          WEBVIEW2_URL: "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/edb19202-9173-4dd1-ab87-c45c2d80aaec/Microsoft.WebView2.FixedVersionRuntime.157.0.4341.46.x64.cab"
          WEBVIEW2_SHA256: "0ac7317a08c3f3beebbb9b6d90f5b77352569f0a33a54a15ef6aaabc82899b7c"
        run: |
          $ErrorActionPreference = 'Stop'
          $cab = Join-Path $env:RUNNER_TEMP 'webview2.cab'
          # A restored cache hit is still verified against the pinned SHA256 below.
          if (-not (Test-Path -LiteralPath $cab)) { Invoke-WebRequest -Uri $env:WEBVIEW2_URL -OutFile $cab -UseBasicParsing }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $cab).Hash.ToLower()
          Write-Host "webview2 cab bytes=$((Get-Item $cab).Length) sha256=$hash"
          if ($hash -ne $env:WEBVIEW2_SHA256) { throw "WebView2 cab sha256 mismatch: $hash" }
          $tmp = Join-Path $env:RUNNER_TEMP 'webview2-expand'
          if (Test-Path -LiteralPath $tmp) { Remove-Item -LiteralPath $tmp -Recurse -Force }
          New-Item -ItemType Directory -Path $tmp | Out-Null
          expand.exe -F:* $cab $tmp | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "expand.exe exit $LASTEXITCODE" }
          # The cab holds one top-level folder Microsoft.WebView2.FixedVersionRuntime.<ver>.x64\
          $inner = @(Get-ChildItem -LiteralPath $tmp -Directory)
          if ($inner.Count -ne 1) { throw "unexpected cab layout: $($inner.Count) top-level folders" }
          $dest = 'desktop/win/publish/webview2'
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          Move-Item -LiteralPath $inner[0].FullName -Destination $dest
          if (-not (Test-Path -LiteralPath (Join-Path $dest 'msedgewebview2.exe'))) { throw 'msedgewebview2.exe missing after expand' }
          Write-Host "webview2 expanded: $dest"

      - name: Cache bundled tool archives
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/ripgrep.zip
            ${{ runner.temp }}/powershell.zip
          # Keys carry the pinned SHA256s; bump together with RG_SHA256 / PWSH_SHA256 below.
          key: bundled-tools-71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5-7d871531806eb1646264e4bbabd9f0c30c23355591bc756bb9909448c29ae166

      - name: Add bundled tools (ripgrep, PowerShell 7)
        shell: pwsh
        env:
          # ripgrep: latest stable at the time of writing. URL and SHA256 are pinned; bump both together.
          RG_VERSION: "15.2.0"
          RG_URL: "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip"
          RG_SHA256: "71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5"
          # PowerShell 7.6.x is the current LTS line (.NET 10, supported to Nov 2028; 7.4 LTS is .NET 8 and reaches
          # end of support in Nov 2026). 7.6.10 is the latest stable 7.6 patch release. Windows 10 1607+ is supported.
          PWSH_VERSION: "7.6.10"
          PWSH_URL: "https://github.com/PowerShell/PowerShell/releases/download/v7.6.10/PowerShell-7.6.10-win-x64.zip"
          PWSH_SHA256: "7d871531806eb1646264e4bbabd9f0c30c23355591bc756bb9909448c29ae166"
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = 'desktop/win/publish/tools'
          if (Test-Path -LiteralPath $tools) { Remove-Item -LiteralPath $tools -Recurse -Force }
          New-Item -ItemType Directory -Path $tools, "$tools/licenses" | Out-Null

          function Get-Verified([string]$url, [string]$sha, [string]$name) {
            $file = Join-Path $env:RUNNER_TEMP $name
            # A restored cache hit is still verified against the pinned SHA256 below.
            if (-not (Test-Path -LiteralPath $file)) { Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
            Write-Host "$name bytes=$((Get-Item $file).Length) sha256=$hash"
            if ($hash -ne $sha) { throw "$name sha256 mismatch: $hash (expected $sha)" }
            return $file
          }

          # ripgrep: rg.exe + licenses
          $rgZip = Get-Verified $env:RG_URL $env:RG_SHA256 'ripgrep.zip'
          $rgTmp = Join-Path $env:RUNNER_TEMP 'ripgrep-expand'
          if (Test-Path -LiteralPath $rgTmp) { Remove-Item -LiteralPath $rgTmp -Recurse -Force }
          Expand-Archive -LiteralPath $rgZip -DestinationPath $rgTmp
          $rgInner = Get-ChildItem -LiteralPath $rgTmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path "$tools/rg" | Out-Null
          Copy-Item -LiteralPath (Join-Path $rgInner.FullName 'rg.exe') -Destination "$tools/rg/rg.exe"
          foreach ($lic in @('COPYING', 'LICENSE-MIT', 'UNLICENSE')) {
            Copy-Item -LiteralPath (Join-Path $rgInner.FullName $lic) -Destination "$tools/licenses/ripgrep-$lic.txt"
          }

          # PowerShell 7: the whole zip goes to tools\pwsh
          $psZip = Get-Verified $env:PWSH_URL $env:PWSH_SHA256 'powershell.zip'
          Expand-Archive -LiteralPath $psZip -DestinationPath "$tools/pwsh"
          foreach ($f in @('LICENSE.txt', 'ThirdPartyNotices.txt')) {
            Copy-Item -LiteralPath (Join-Path "$tools/pwsh" $f) -Destination "$tools/licenses/powershell-$f"
          }

          foreach ($need in @('rg/rg.exe', 'pwsh/pwsh.exe', 'licenses/ripgrep-LICENSE-MIT.txt', 'licenses/powershell-LICENSE.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $tools $need))) { throw "tools/$need missing" }
          }
          $rgSize = (Get-ChildItem -LiteralPath "$tools/rg" -Recurse -File | Measure-Object Length -Sum).Sum
          $psSize = (Get-ChildItem -LiteralPath "$tools/pwsh" -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("tools unpacked: rg {0:N1} MB, pwsh {1:N1} MB" -f ($rgSize / 1MB), ($psSize / 1MB))

      - name: Pack portable zip
        run: node scripts/pack-release.mjs --platform win-x64 --shell desktop/win/publish --out dist

      - name: Smoke test portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $zip = Get-ChildItem -Path dist -Filter 'weft-*-win-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'dist has no win-x64 zip' }
          Write-Host ("zip=" + $zip.FullName)
          Write-Host ("zip bytes=" + $zip.Length)
          Write-Host ("zip sha256=" + (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLower())

          $root = Join-Path $env:RUNNER_TEMP 'weft smoke 中文'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          # Windows tar.exe does not accept --force-local, and a drive-letter archive path is easy to misread.
          # ZipFile takes a normal Windows path, including spaces and Chinese in the destination.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, $root)

          $node = Join-Path $root 'node\node.exe'
          $cli = Join-Path $root 'app\bin\weft.mjs'
          if (-not (Test-Path -LiteralPath $node)) { throw "missing $node" }
          if (-not (Test-Path -LiteralPath $cli)) { throw "missing $cli" }
          foreach ($launcher in @('Weft.exe', 'webview2\msedgewebview2.exe', 'Weft.cmd', 'Weft-stop.cmd', 'README.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $launcher))) { throw "missing $launcher" }
          }
          # No .NET Framework leftovers and no loose managed dlls: the shell is one self-contained exe.
          foreach ($copilot in @('webview2\copilotapp.exe', 'webview2\mscopilot.exe', 'webview2\Installer\copilot_setup.exe')) {
            if (Test-Path -LiteralPath (Join-Path $root $copilot)) { throw "unexpected $copilot in package (WebView2 Copilot programs must be stripped)" }
          }
          foreach ($gone in @('Weft.exe.config', 'Microsoft.Web.WebView2.Core.dll', 'runtimes')) {
            if (Test-Path -LiteralPath (Join-Path $root $gone)) { throw "unexpected $gone in package root" }
          }
          Write-Host '--- package root ---'
          Get-ChildItem -LiteralPath $root -Force | ForEach-Object { Write-Host ("root> " + $_.Name + $(if ($_.PSIsContainer) { '\' } else { ' ' + $_.Length })) }
          $rootFiles = @(Get-ChildItem -LiteralPath $root -File | ForEach-Object { $_.Name })
          Write-Host ("root files: " + ($rootFiles -join ', '))

          Write-Host '--- Weft.exe --self-check ---'
          $selfOut = Join-Path $env:RUNNER_TEMP 'self-check.txt'
          if (Test-Path -LiteralPath $selfOut) { Remove-Item -LiteralPath $selfOut -Force }
          $p = Start-Process -FilePath (Join-Path $root 'Weft.exe') -ArgumentList @('--self-check', '--out', $selfOut) -Wait -PassThru
          if (-not (Test-Path -LiteralPath $selfOut)) { throw 'self-check wrote no output' }
          $selfText = Get-Content -LiteralPath $selfOut -Raw
          Write-Host $selfText
          if ($p.ExitCode -ne 0) { throw "self-check exit $($p.ExitCode)" }
          if ($selfText -notmatch '(?m)^dotnet: 8\.') { throw 'self-check is not running on .NET 8' }
          if ($selfText -notmatch '(?m)^webview2\.source: bundled\r?$') { throw 'self-check did not pick the bundled WebView2' }
          if ($selfText -notmatch '(?m)^webview2\.version: 157\.') { throw 'unexpected bundled WebView2 version' }
          if ($selfText -notmatch '(?m)^webview2\.permissions: ready\r?$') { throw 'WebView2 folder permissions are not ready' }

          Write-Host '--- app/node_modules ---'
          $nm = Join-Path $root 'app\node_modules'
          $banned = @('vite', 'rolldown', 'lightningcss', 'esbuild', 'typescript', 'eslint', 'vitest', 'jsdom', 'playwright', '@playwright/test')
          Get-ChildItem -LiteralPath $nm -Force | ForEach-Object {
            if ($_.Name -eq '.bin' -or $_.Name.StartsWith('.')) { return }
            $dirs = @()
            if ($_.Name.StartsWith('@')) {
              $dirs = @(Get-ChildItem -LiteralPath $_.FullName -Directory)
            } else {
              $dirs = @($_)
            }
            foreach ($dir in $dirs) {
              $pkgJson = Join-Path $dir.FullName 'package.json'
              if (-not (Test-Path -LiteralPath $pkgJson)) { continue }
              $pkg = Get-Content -LiteralPath $pkgJson -Raw -Encoding UTF8 | ConvertFrom-Json
              Write-Host ("pkg " + $pkg.name + "@" + $pkg.version)
            }
          }
          $hits = @(Get-ChildItem -LiteralPath $nm -Recurse -Filter package.json -File | Where-Object {
            try {
              $name = (Get-Content -LiteralPath $_.FullName -Raw -Encoding UTF8 | ConvertFrom-Json).name
              $banned -contains $name
            } catch {
              $false
            }
          })
          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { Write-Host ("banned " + $_.FullName) }
            throw 'zip contains devDependencies'
          }

          $version = (& $node -p 'process.version').Trim()
          $execPath = (& $node -p 'process.execPath').Trim()
          Write-Host "bundled version=$version"
          Write-Host "bundled execPath=$execPath"
          if ($version -ne 'v22.23.4') { throw "expected v22.23.4, got $version" }
          $rootFull = (Resolve-Path -LiteralPath $root).Path
          $execFull = (Resolve-Path -LiteralPath $execPath).Path
          if (-not $execFull.StartsWith($rootFull, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "execPath $execFull is outside $rootFull"
          }

          # Bundled tools: present, runnable from a path with spaces and Chinese, and picked up by doctor.
          foreach ($tool in @('tools\rg\rg.exe', 'tools\pwsh\pwsh.exe', 'tools\licenses\ripgrep-LICENSE-MIT.txt', 'tools\licenses\powershell-LICENSE.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $tool))) { throw "missing $tool" }
          }
          Write-Host '--- bundled tools ---'
          $rgOut = (& (Join-Path $root 'tools\rg\rg.exe') --version 2>&1 | ForEach-Object { "$_" }) -join "`n"
          Write-Host "rg --version:`n$rgOut"
          if ($LASTEXITCODE -ne 0 -or $rgOut -notmatch 'ripgrep 15\.2\.0') { throw 'bundled rg.exe did not run' }
          $psOut = (& (Join-Path $root 'tools\pwsh\pwsh.exe') -NoProfile -Command '$PSVersionTable.PSVersion' 2>&1 | ForEach-Object { "$_" }) -join "`n"
          Write-Host "pwsh `$PSVersionTable.PSVersion:`n$psOut"
          if ($LASTEXITCODE -ne 0 -or $psOut -notmatch '7\s+6\s+10') { throw 'bundled pwsh.exe did not run' }

          $env:Path = (($env:Path -split ';' | Where-Object { $_ -and ($_ -notmatch '(?i)node') }) -join ';')
          $data = Join-Path (Get-Location) 'smoke-data'
          if (Test-Path -LiteralPath $data) { Remove-Item -LiteralPath $data -Recurse -Force }
          New-Item -ItemType Directory -Path $data | Out-Null
          $env:WEFT_DATA_DIR = $data

          Write-Host '--- weft doctor (bundled tools) ---'
          $docText = (& $node (Join-Path $root 'app\bin\weft.mjs') doctor 2>&1 | ForEach-Object { "$_" }) -join "`n"
          Write-Host $docText
          if ($docText -notmatch '(?m)^rg: 来源 bundled，.*ripgrep 15\.2\.0') { throw 'doctor did not report the bundled rg' }
          if ($docText -notmatch '(?m)^pwsh: 来源 bundled，.*7\.6\.10') { throw 'doctor did not report the bundled pwsh' }

          function Show-ServiceLog {
            $log = Join-Path $env:WEFT_DATA_DIR 'logs\service.log'
            if (Test-Path -LiteralPath $log) {
              Write-Host '--- service.log ---'
              Get-Content -LiteralPath $log -Tail 120
            }
          }

          $pushed = $false
          try {
            Push-Location -LiteralPath $root
            $pushed = $true
            $lines = @(& .\node\node.exe .\app\bin\weft.mjs open --print 2>&1 | ForEach-Object { "$_" })
            $openCode = $LASTEXITCODE
            $lines | ForEach-Object { Write-Host "open> $_" }
            if ($openCode -ne 0) { throw "open --print exit $openCode" }
            $url = @($lines | Where-Object { $_ -match '^http://127\.0\.0\.1:\d+/auth\?code=' } | Select-Object -Last 1)
            if (-not $url) { throw 'open --print did not print a login url' }
            $url = "$url".Trim()
            Write-Host "login=$url"

            $homeUrl = $url -replace '/auth\?code=.*$', '/'
            $resp = Invoke-WebRequest -Uri $homeUrl -UseBasicParsing
            if ([int]$resp.StatusCode -ne 200) { throw "home HTTP $($resp.StatusCode)" }
            $html = [string]$resp.Content
            if ($html -notmatch '<title>Weft</title>') { throw 'homepage is not the Weft frontend' }
            if ($html -notmatch 'id="root"') { throw 'homepage missing #root' }
            if ($html -match '/src/main\.tsx') { throw 'homepage is the dev index, not the build' }
            if ($html -match '未构建') { throw 'frontend was not built' }
            Write-Host "home HTTP $($resp.StatusCode) bytes=$($html.Length)"

            $login = Invoke-WebRequest -Uri $url -UseBasicParsing -MaximumRedirection 5
            if ([int]$login.StatusCode -ne 200) { throw "login HTTP $($login.StatusCode)" }
            $loginHtml = [string]$login.Content
            if ($loginHtml -notmatch '<title>Weft</title>' -or $loginHtml -notmatch 'id="root"') {
              throw 'login link did not return the frontend'
            }
            Write-Host "login HTTP $($login.StatusCode) bytes=$($loginHtml.Length)"

            $stopLines = @(& cmd.exe /d /c 'Weft-stop.cmd' 2>&1 | ForEach-Object { "$_" })
            $stopCode = $LASTEXITCODE
            $stopLines | ForEach-Object { Write-Host "stop> $_" }
            if ($stopCode -ne 0) { throw "Weft-stop.cmd exit $stopCode" }

            $statusLines = @(& .\node\node.exe .\app\bin\weft.mjs status 2>&1 | ForEach-Object { "$_" })
            $statusCode = $LASTEXITCODE
            $statusLines | ForEach-Object { Write-Host "status> $_" }
            if ($statusCode -eq 0) { throw 'service still running after stop' }
            Write-Host 'stopped'
          } catch {
            Show-ServiceLog
            throw
          } finally {
            if ($pushed) { Pop-Location }
            if (Test-Path -LiteralPath $node) {
              & $node $cli stop 2>&1 | Out-Null
            }
          }

      - name: Upload portable zip
        uses: actions/upload-artifact@v7
        with:
          name: weft-win-x64
          path: dist/weft-*-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload smoke log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portable-smoke-log
          path: smoke-data/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach zip to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/intranet-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          shopt -s nullglob
          files=(dist/weft-*-win-x64.zip)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "expected one zip, found ${#files[@]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[0]}" --clobber

      # ---- 自制安装程序（desktop/installer）：在 zip 冒烟之后，用同一个 zip 做 Setup ----
      - name: Test installer logic
        run: |
          dotnet test desktop/installer/tests -c Release
          node --test tests/unit/build-installer.test.mjs

      - name: Publish installer
        run: dotnet publish desktop/installer -c Release -o installer-out

      - name: Build Weft-Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -Path dist -Filter 'weft-*-win-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'dist has no win-x64 zip' }
          node scripts/build-installer.mjs --package $zip.FullName --installer installer-out/WeftSetup.exe --out dist
          if ($LASTEXITCODE -ne 0) { throw "build-installer exit $LASTEXITCODE" }
          $setup = Get-ChildItem -Path dist -Filter 'Weft-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'dist has no Weft-Setup exe' }
          $mb = [math]::Round($setup.Length / 1MB, 1)
          Write-Host ("setup=" + $setup.FullName)
          Write-Host ("setup bytes=" + $setup.Length + " (" + $mb + " MB)")
          Write-Host ("setup sha256=" + (Get-FileHash -Algorithm SHA256 -LiteralPath $setup.FullName).Hash.ToLower())
          "Weft-Setup size: $mb MB ($($setup.Length) bytes); zip: $([math]::Round($zip.Length / 1MB, 1)) MB" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Smoke test installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $setup = (Get-ChildItem -Path dist -Filter 'Weft-Setup-*.exe' | Select-Object -First 1).FullName
          $log = Join-Path $env:TEMP 'Weft-Setup.log'
          $logKeep = Join-Path (Get-Location) 'setup-smoke-logs'
          New-Item -ItemType Directory -Force -Path $logKeep | Out-Null
          $root = Join-Path $env:RUNNER_TEMP 'weft 安装 中文'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          $data = Join-Path (Get-Location) 'setup-smoke-data'
          if (Test-Path -LiteralPath $data) { Remove-Item -LiteralPath $data -Recurse -Force }
          New-Item -ItemType Directory -Path $data | Out-Null
          $env:WEFT_DATA_DIR = $data
          $regPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Weft'
          $startLnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Weft.lnk'
          $deskLnk = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Weft.lnk'
          # 默认数据位置：卸载默认保留，勾选「同时删除数据」才删
          $appData = Join-Path $env:APPDATA 'Weft'
          New-Item -ItemType Directory -Force -Path $appData | Out-Null
          Set-Content -LiteralPath (Join-Path $appData 'sentinel.txt') -Value 'keep'

          function Run-Exe([string]$exe, [string]$argLine) {
            if (Test-Path -LiteralPath $log) { Remove-Item -LiteralPath $log -Force }
            $p = Start-Process -FilePath $exe -ArgumentList $argLine -Wait -PassThru -WindowStyle Hidden
            $code = $p.ExitCode
            if (Test-Path -LiteralPath $log) {
              Write-Host "--- Weft-Setup.log ($argLine) ---"
              Get-Content -LiteralPath $log | ForEach-Object { Write-Host "log> $_" }
              Copy-Item -LiteralPath $log -Destination (Join-Path $logKeep ("run-{0}.log" -f (Get-Date -Format 'HHmmss-fff'))) -Force
            }
            Write-Host "exit=$code"
            return $code
          }
          function Log-Text { if (Test-Path -LiteralPath $log) { return (Get-Content -LiteralPath $log -Raw) } else { return '' } }
          function Assert-True($cond, [string]$msg) { if (-not $cond) { throw "FAILED: $msg" } }
          # WScript.Shell 返回的 TargetPath 会把中文转成 ?，直接在 .lnk 的二进制里找 UTF-16 路径
          function Lnk-Has([string]$lnk, [string]$text) {
            $b = [System.IO.File]::ReadAllBytes($lnk)
            $needle = [System.Text.Encoding]::Unicode.GetString([System.Text.Encoding]::Unicode.GetBytes($text))
            foreach ($off in 0, 1) {
              if ([System.Text.Encoding]::Unicode.GetString($b, $off, $b.Length - $off - (($b.Length - $off) % 2)).Contains($needle)) { return $true }
            }
            return $false
          }
          function Start-Weft {
            Push-Location -LiteralPath $root
            try {
              $lines = @(& .\node\node.exe .\app\bin\weft.mjs open --print 2>&1 | ForEach-Object { "$_" })
              $code = $LASTEXITCODE
              $lines | ForEach-Object { Write-Host "open> $_" }
              if ($code -ne 0) { throw "open --print exit $code" }
              $url = @($lines | Where-Object { $_ -match '^http://127\.0\.0\.1:\d+/auth\?code=' } | Select-Object -Last 1)
              if (-not $url) { throw 'open --print did not print a login url' }
              $homeUrl = ("$url").Trim() -replace '/auth\?code=.*$', '/'
              $resp = Invoke-WebRequest -Uri $homeUrl -UseBasicParsing
              if ([int]$resp.StatusCode -ne 200) { throw "home HTTP $($resp.StatusCode)" }
              Write-Host "service up: $homeUrl"
            } finally { Pop-Location }
          }
          function Weft-Running {
            Push-Location -LiteralPath $root
            try { & .\node\node.exe .\app\bin\weft.mjs status 2>&1 | Out-Null; return ($LASTEXITCODE -eq 0) } finally { Pop-Location }
          }
          function Assert-Installed([string]$dir) {
            foreach ($f in @('Weft.exe', 'node\node.exe', 'app\bin\weft.mjs', 'Weft.cmd', 'Weft-stop.cmd', 'uninstall.exe', 'install-manifest.json', 'tools\rg\rg.exe', 'tools\pwsh\pwsh.exe', 'tools\licenses\ripgrep-LICENSE-MIT.txt', 'tools\licenses\powershell-LICENSE.txt')) {
              Assert-True (Test-Path -LiteralPath (Join-Path $dir $f)) "missing $f"
            }
            $m = Get-Content -LiteralPath (Join-Path $dir 'install-manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
            foreach ($f in $m.files) {
              $p = Join-Path $dir ($f.path -replace '/', '\')
              Assert-True (Test-Path -LiteralPath $p) "manifest file missing on disk: $($f.path)"
              Assert-True ((Get-Item -LiteralPath $p).Length -eq $f.size) "size differs: $($f.path)"
            }
            # 抽查哈希：node.exe 和入口脚本
            foreach ($f in @($m.files | Where-Object { $_.path -in @('node/node.exe', 'app/bin/weft.mjs', 'Weft.exe', 'tools/rg/rg.exe', 'tools/pwsh/pwsh.exe') })) {
              $h = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dir ($f.path -replace '/', '\'))).Hash.ToLower()
              Assert-True ($h -eq $f.sha256) "sha256 differs: $($f.path)"
            }
            return $m
          }

          try {
            # ---- 1. 静默安装到含空格和中文的目录 ----
            Write-Host '=== 1. install ==='
            $code = Run-Exe $setup "/S /D=`"$root`""
            Assert-True ($code -eq 0) "install exit $code"
            $m = Assert-Installed $root
            $count = @($m.files).Count
            Write-Host "manifest version=$($m.version) files=$count"
            $reg = Get-ItemProperty -LiteralPath $regPath
            Assert-True ($reg.DisplayName -eq 'Weft') 'DisplayName'
            Assert-True ($reg.DisplayVersion -eq $m.version) "DisplayVersion $($reg.DisplayVersion) != $($m.version)"
            Assert-True ($reg.InstallLocation -eq $root) "InstallLocation $($reg.InstallLocation)"
            Assert-True ($reg.UninstallString -like '*uninstall.exe*/uninstall') "UninstallString $($reg.UninstallString)"
            Assert-True ($reg.QuietUninstallString -like '*uninstall.exe*/uninstall /S') "QuietUninstallString $($reg.QuietUninstallString)"
            Assert-True ($reg.DisplayIcon -like '*Weft.exe*') 'DisplayIcon'
            Assert-True ([int]$reg.EstimatedSize -gt 0) 'EstimatedSize'
            Assert-True ($reg.NoModify -eq 1 -and $reg.NoRepair -eq 1) 'NoModify/NoRepair'
            Assert-True (Test-Path -LiteralPath $startLnk) 'start menu shortcut'
            Assert-True (Test-Path -LiteralPath $deskLnk) 'desktop shortcut'
            Assert-True (Lnk-Has $startLnk (Join-Path $root 'Weft.exe')) 'start lnk should point at Weft.exe in the install dir'
            Assert-True ((Log-Text) -match "total=$count written=$count skipped=0") 'first install should write every file'

            # 安装时就该补好 webview2\ 的权限；先查 ACL（self-check 自己也会补，所以要在它之前查）
            $wvDir = Join-Path $root 'webview2'
            Assert-True (Test-Path -LiteralPath (Join-Path $wvDir 'msedgewebview2.exe')) 'webview2 should be installed'
            $wvRules = [System.IO.FileSystemAclExtensions]::GetAccessControl([System.IO.DirectoryInfo]$wvDir).GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])
            foreach ($sid in @('S-1-15-2-1', 'S-1-15-2-2')) {
              $hit = @($wvRules | Where-Object { $_.IdentityReference.Value -eq $sid -and $_.AccessControlType -eq 'Allow' -and (($_.FileSystemRights -band 'ReadAndExecute') -eq 'ReadAndExecute') })
              Assert-True ($hit.Count -gt 0) "installer should have granted $sid on webview2"
            }
            Assert-True ((Log-Text) -match 'webview2 权限') 'installer log should mention webview2 permissions'
            $selfOut = Join-Path $env:RUNNER_TEMP 'installed-self-check.txt'
            if (Test-Path -LiteralPath $selfOut) { Remove-Item -LiteralPath $selfOut -Force }
            $sp = Start-Process -FilePath (Join-Path $root 'Weft.exe') -ArgumentList @('--self-check', '--out', "`"$selfOut`"") -Wait -PassThru
            Assert-True (Test-Path -LiteralPath $selfOut) 'installed Weft.exe --self-check wrote no output'
            $selfText = Get-Content -LiteralPath $selfOut -Raw
            Write-Host '--- installed Weft.exe --self-check ---'
            Write-Host $selfText
            Assert-True ($sp.ExitCode -eq 0) "self-check exit $($sp.ExitCode)"
            foreach ($c in @('copilotapp.exe', 'mscopilot.exe', 'Installer\copilot_setup.exe')) {
              Assert-True (-not (Test-Path -LiteralPath (Join-Path $wvDir $c))) "installed webview2 should not contain $c"
            }
            Assert-True ($selfText -match '(?m)^webview2\.source: bundled\r?$') 'installed self-check should use the bundled WebView2'
            Assert-True ($selfText -match '(?m)^webview2\.permissions: ready\r?$') 'installed self-check should report permissions: ready'

            # ---- 2. 起服务再停 ----
            Write-Host '=== 2. service start/stop ==='
            Start-Weft
            Assert-True (Weft-Running) 'service should be running'
            Push-Location -LiteralPath $root
            $stopLines = @(& cmd.exe /d /c 'Weft-stop.cmd' 2>&1 | ForEach-Object { "$_" })
            $stopCode = $LASTEXITCODE
            Pop-Location
            $stopLines | ForEach-Object { Write-Host "stop> $_" }
            Assert-True ($stopCode -eq 0) "Weft-stop.cmd exit $stopCode"
            Assert-True (-not (Weft-Running)) 'service should be stopped'

            # ---- 3. 再装同一个包：不带 /D，靠登记识别升级路径，全部跳过 ----
            Write-Host '=== 3. upgrade (same package) ==='
            $code = Run-Exe $setup '/S'
            Assert-True ($code -eq 0) "upgrade exit $code"
            $t = Log-Text
            Assert-True ($t -match '识别：Upgrade') 'second run should take the upgrade path'
            Assert-True ($t -match 'registry') 'upgrade dir should come from the registry'
            Assert-True ($t -match "total=$count written=0 skipped=$count removed=0") "upgrade should skip all $count files"
            Assert-Installed $root | Out-Null

            # ---- 4. 改坏一个文件 + 服务在运行：只重写那一个，并先停掉服务 ----
            Write-Host '=== 4. upgrade with a changed file while Weft is running ==='
            Add-Content -LiteralPath (Join-Path $root 'README.txt') -Value 'tampered'
            Start-Weft
            Assert-True (Weft-Running) 'service should be running before upgrade'
            $code = Run-Exe $setup '/S'
            Assert-True ($code -eq 0) "upgrade-while-running exit $code"
            $t = Log-Text
            Assert-True ($t -match 'written=1 skipped=') 'only the changed file should be rewritten'
            Assert-True (-not (Weft-Running)) 'upgrade should have stopped the service'
            Assert-True (-not ((Get-Content -LiteralPath (Join-Path $root 'README.txt') -Raw) -match 'tampered')) 'README.txt should be restored'
            Assert-Installed $root | Out-Null

            # ---- 5. 服务在运行时卸载（默认保留数据）----
            Write-Host '=== 5. uninstall ==='
            Start-Weft
            $code = Run-Exe $setup '/uninstall /S'
            Assert-True ($code -eq 0) "uninstall exit $code"
            Assert-True (-not (Test-Path -LiteralPath $root)) 'install dir should be gone'
            Assert-True (-not (Test-Path -LiteralPath $startLnk)) 'start menu shortcut should be gone'
            Assert-True (-not (Test-Path -LiteralPath $deskLnk)) 'desktop shortcut should be gone'
            Assert-True (-not (Test-Path -LiteralPath $regPath)) 'registry key should be gone'
            Assert-True (Test-Path -LiteralPath (Join-Path $appData 'sentinel.txt')) 'data dir must be kept'
            Assert-True (Test-Path -LiteralPath $data) 'WEFT_DATA_DIR must be kept'

            # ---- 6. 装回去，用 uninstall.exe（延迟删除自己）+ 删除数据 ----
            Write-Host '=== 6. uninstall.exe with /deletedata ==='
            $code = Run-Exe $setup "/S /D=`"$root`" /NODESKTOP"
            Assert-True ($code -eq 0) "reinstall exit $code"
            Assert-True (-not (Test-Path -LiteralPath $deskLnk)) '/NODESKTOP should skip the desktop shortcut'
            $q = (Get-ItemProperty -LiteralPath $regPath).QuietUninstallString
            Write-Host "QuietUninstallString=$q"
            $code = Run-Exe (Join-Path $root 'uninstall.exe') '/uninstall /S /deletedata'
            Assert-True ($code -eq 0) "uninstall.exe exit $code"
            $deadline = (Get-Date).AddSeconds(30)
            while ((Test-Path -LiteralPath $root) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            Assert-True (-not (Test-Path -LiteralPath $root)) 'uninstall.exe should delete itself and the install dir'
            Assert-True (-not (Test-Path -LiteralPath $regPath)) 'registry key should be gone (2)'
            Assert-True (-not (Test-Path -LiteralPath $startLnk)) 'start menu shortcut should be gone (2)'
            Assert-True (-not (Test-Path -LiteralPath $appData)) '/deletedata should remove %APPDATA%\Weft'

            # ---- 7. 没装东西时卸载：退出码 9 ----
            $code = Run-Exe $setup '/uninstall /S'
            Assert-True ($code -eq 9) "uninstall with nothing installed should exit 9, got $code"
            Write-Host 'installer smoke passed'
          } catch {
            Write-Host "ERROR: $_"
            $svc = Join-Path $data 'logs\service.log'
            if (Test-Path -LiteralPath $svc) { Write-Host '--- service.log ---'; Get-Content -LiteralPath $svc -Tail 80 }
            throw
          } finally {
            $node = Join-Path $root 'node\node.exe'
            if (Test-Path -LiteralPath $node) { & $node (Join-Path $root 'app\bin\weft.mjs') stop 2>&1 | Out-Null }
          }

      - name: Upload Weft-Setup
        uses: actions/upload-artifact@v7
        with:
          name: weft-setup-win-x64
          path: dist/Weft-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      # 预览图只是自检手段：放在安装包产出和冒烟之后，卡住或失败都不影响安装包
      - name: Render installer preview
        id: render_preview
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:TEMP 'Weft-Setup.log'
          $p = Start-Process -FilePath installer-out/WeftSetup.exe -ArgumentList '--render-preview', 'installer-preview' -PassThru
          $done = $p.WaitForExit(120000)
          $n = (Get-ChildItem installer-preview -Filter *.png -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "preview pngs=$n"
          if (Test-Path $log) { Write-Host '--- Weft-Setup.log (tail) ---'; Get-Content $log -Tail 40 }
          if (-not $done) { try { $p.Kill($true) } catch {}; throw "render-preview timed out after $n pngs" }
          if ($p.ExitCode -ne 0) { throw "render-preview exit $($p.ExitCode) after $n pngs" }
          if ($n -lt 104) { throw "expected 104 preview pngs, got $n" }

      - name: Upload installer preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-preview
          path: installer-preview/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer smoke log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-smoke-log
          path: |
            setup-smoke-logs/
            setup-smoke-data/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach Weft-Setup to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/intranet-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(dist/Weft-Setup-*.exe)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "expected one Weft-Setup exe, found ${#files[@]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[0]}" --clobber
