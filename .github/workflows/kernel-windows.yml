name: kernel windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/kernel-harness]

jobs:
  kernel-unit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Unit tests
        shell: bash
        run: node --test tests/unit/*.test.mjs
      - name: Repeat v2-changes (T43-1 flake probe)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "v2-changes probe $i"
            node --test tests/unit/v2-changes.test.mjs
          done
