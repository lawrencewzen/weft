name: ci

on:
  push:
    branches: [main]
    # 只有 push 到 main 时跳过纯文档改动。PR 一律跑：main 的分支保护把
    # check / unit (ubuntu-latest) / unit (windows-latest) / e2e 设成必需检查，
    # PR 不触发就永远不会上报结果，纯文档 PR 会被卡住合并不了。
    paths-ignore:
      - docs/**
      - design/**
      - "**/*.md"
  pull_request:
    branches: [main]

# 同一个 PR 新推送时取消旧运行；main 上的运行不取消。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run typecheck:web
      - run: npm run check:contract
      - run: npm run test:web

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Unit tests
        shell: bash
        run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
