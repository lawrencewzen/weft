name: ci

on:
  push:
    branches: [main, intranet]
    # 只有 push 到 main 时跳过纯文档改动。PR 一律跑：main 的分支保护把
    # check / unit (ubuntu-latest) / unit (windows-latest) / e2e 设成必需检查，
    # PR 不触发就永远不会上报结果，纯文档 PR 会被卡住合并不了。
    paths-ignore:
      - docs/**
      - design/**
      - "**/*.md"
  pull_request:
    branches: [main, intranet]

# 同一个 PR 新推送时取消旧运行；main 上的运行不取消。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run typecheck:web
      - run: npm run lint
      - run: npm run check:contract
      - run: npm run test:web

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Unit tests
        shell: bash
        run: npm test

  # e2e 按文件分 5 片并行（workers 仍是 1，每片一台机器）。
  # 必需检查名是 e2e，由下面的汇总 job 提供，分片 job 的名字不进分支保护。
  e2e-shard:
    name: e2e-shard (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p \"require('@playwright/test/package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build interactive prototype
        run: npm run build:proto
      - name: Playwright e2e (shard ${{ matrix.shard }}/5)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/5
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # 汇总：保持必需检查名 e2e 不变。分片全部成功才成功。
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check shard results
        run: |
          echo "e2e-shard result: ${{ needs.e2e-shard.result }}"
          [ "${{ needs.e2e-shard.result }}" = "success" ]
