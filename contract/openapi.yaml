    ThinkingLevel:
      type: string
      enum:
        - off
        - minimal
        - low
        - medium
        - high
        - xhigh
        - max
      description: pi-ai 思考档位。界面按模型支持的显示为关 / 低 / 中 / 高 / 更高 / 最高。
    ProviderModel:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - brand
        - enabled
        - contextWindow
        - maxTokens
        - images
        - reasoning
        - overridden
      properties:
        id:
          type: string
        name:
          type: string
          description: 模型自带的显示名；没有就等于 id
        brand:
          description: 模型品牌图标 id。认不出为 null
          oneOf:
            - type: "null"
            - type: string
        enabled:
          type: boolean
        contextWindow:
          description: 已应用用户覆盖；null = 未知（运行时按 128000 算）
          oneOf:
            - type: "null"
            - type: integer
        maxTokens:
          description: 已应用用户覆盖；null = 未知
          oneOf:
            - type: "null"
            - type: integer
        images:
          type: boolean
        reasoning:
          type: boolean
        thinkingLevels:
          type: array
          items:
            $ref: "#/components/schemas/ThinkingLevel"
          description: |
            该模型支持的思考档位，来自 getSupportedThinkingLevels。非推理模型为空数组。
            顺序从低到高：off / minimal / low / medium / high / xhigh / max（按模型支持的显示）。
        defaultThinkingLevel:
          description: 未选档位时的默认。所有推理模型默认 medium，再经 clampThinkingLevel 得到实际值。非推理模型为 null。
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ThinkingLevel"
        overridden:
          $ref: "#/components/schemas/ModelOverridden"
      description: Provider 上的一个 chat 模型。
    Provider:
      type: object
