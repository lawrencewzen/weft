  /api/v2/workspaces/{id}/files:
    get:
      operationId: getWorkspaceFile
      summary: 读工作区文件
      description: |
        返回 FileContent。超过 2 MB（环境变量 WEFT_V2_MAX_FILE_BYTES，仅测试用）时 tooLarge 为 true、text 为 null。
        前 8 KB 里有 NUL 字节或不是合法 UTF-8 时 binary 为 true、text 为 null。
        version 是内容 sha256 的十六进制前 16 位，保存时用来检测冲突。
        越界 403 E_SANDBOX；不存在 404；是目录 400。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工作区 id
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: 相对工作区的文件路径
      responses:
        "200":
          description: 文件内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "400":
          description: 路径是目录或缺少 path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "403":
          description: 路径越界
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 工作区或文件不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
    put:
      operationId: saveWorkspaceFile
      summary: 保存工作区文件
      description: |
        请求体 `{ path, text, baseVersion? }`。带了 baseVersion 且和磁盘当前内容的 version 不同时
        返回 409 `{ error, code: E_CONFLICT, current: FileContent }`，不写入。
        否则写入（需要时建目录），返回 200 `{ path, version, added, removed }`。
        越界 403 E_SANDBOX。写入后若该文件在某个对话的变更列表里，对应 conversation 主题会重算。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工作区 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFileRequest"
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"
        "400":
          description: 请求体无效或路径是目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "403":
          description: 路径越界
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
