openapi: 3.1.0
info:
  title: Weft v2
  version: "2.0.0"
  description: Weft v2 HTTP 契约。本文件是协议的唯一依据。
paths:
  /api/v2/service:
    get:
      operationId: getService
      summary: 查询服务信息
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: 当前进程的服务信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/service/restart:
    post:
      operationId: restartService
      summary: 请求服务退出，由客户端重新拉起
      description: |
        服务只负责退出当前进程，不负责再拉起。客户端在收到 202 后自行启动新进程。
        任务图里还有活着的任务（含后台子 Agent）时返回 409，避免打断正在跑的工作。
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "202":
          description: 已接受，服务即将退出。重新拉起由客户端完成。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartAccepted"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "409":
          description: 有活着的任务，此时不能退出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/auth/web-code:
    post:
      operationId: createWebCode
      summary: 用本机令牌签发一次性网页登录码
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: 一次性登录码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebCode"
        "400":
          description: 请求体不是 JSON 对象
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权（仅接受 Bearer 本机令牌）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "413":
          description: 请求体过大
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/events:
    get:
      operationId: getEvents
      summary: SSE 推送流
      description: |
        一个客户端一条 SSE 连接，用查询参数 `topics` 订阅主题（逗号分隔），`lang` 为 zh 或 en（缺省 zh，不认识的按 zh）。
        每条业务事件带全局递增序号，写成标准 SSE：`id: <序号>`、`event: <类型>`、`data: <JSON>`。
        断线后带 `Last-Event-ID` 头（或查询参数 `lastEventId`）续传；环形缓冲里补不上（太旧、比当前还新、或格式不对）时先发一份新快照。
        没带 Last-Event-ID 时先发快照。快照的 SSE id 是当时的最新序号。
        订阅的主题和上次不同时，客户端不要带 Last-Event-ID / lastEventId，直接重新连接拿快照（续传只保证同一组主题）。
        心跳每 15 秒一次，不带 id，不进缓冲。

        主题 `workspaces` 注册为精确主题。实体：
        - `workspace`：id 为工作区 id，值为 Workspace
        - `conversation_summary`：id 为对话 id，值为 ConversationSummary

        快照与 GET /api/v2/workspaces 同一套数据拆成上述实体。工作区或对话增删改、运行状态或子 Agent 计数变化时 upsert；实体删除时 remove。

        主题 `conversation:<id>`（`<id>` 为对话 id）按前缀动态注册。实体：
        - `conversation`：id 为对话 id，值为 ConversationView
        - `item`：id 为 ThreadItem.id，值为 ThreadItem
        - `tool`：id 为 ToolCall.id，值为 ToolCall
        - `subagent`：id 为子 Agent id，值为 Subagent。卡住由服务端判定：kernel 状态为 running 且超过 stuckAfterMs（默认 60000，环境变量 WEFT_SUBAGENT_STUCK_MS）没有活动时 status 为 stuck，到点推送 upsert。
        - `change`：id 为相对工作区的路径（统一用 `/`），值为 Change。快照带上当前变更列表。工具结束（write / edit / bash 都可能改文件）或经保存接口写入后随重算更新：变了才 upsert，从列表消失则 remove。不做文件监听。

        快照是 GET /api/v2/conversations/{id} 的 conversation / items / tools，再加上该对话的 subagent 和 change 实体。模型流式输出时先 upsert 一条 `item`，id 以 `live:` 开头、`streaming` 为 true、`text` 为空；随后用 `text.delta` 追加。正式助手消息到来后 remove 这条流式项，再 upsert 正式项和 conversation。

        主题 `subagent:<cid>:<agentId>`（`<cid>` 为父对话 id，`<agentId>` 为子 Agent id）按前缀动态注册。实体：
        - `subagent`：id 为子 Agent id，值为 Subagent
        - `item`：id 为 ThreadItem.id，值为 ThreadItem（子 Agent 自己的消息流，没有嵌套子 Agent 汇报）
        - `tool`：id 为 ToolCall.id，值为 ToolCall

        快照是 GET /api/v2/conversations/{id}/subagents/{agentId} 同一套数据拆成上述实体。订阅父对话的内核事件（含 `agent`）后重算；子 Agent 的进展会体现在父对话事件里。

        订阅不存在的对话或子 Agent 时仍返回 200：先发 snapshot，entities 为空，并在 snapshot 数据里加 `missing: ["conversation:<id>"]` 或 `missing: ["subagent:<cid>:<agentId>"]`，连接保持。

        事件名与 data 的对应关系：
        - `snapshot` → SnapshotEvent
        - `upsert` → UpsertEvent
        - `remove` → RemoveEvent
        - `text.delta` → TextDeltaEvent
        - `heartbeat` → HeartbeatEvent
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: topics
          in: query
          required: true
          schema:
            type: string
          description: 逗号分隔的主题列表。空或含未注册主题时 400。`workspaces` 已注册；`conversation:<id>` 和 `subagent:<cid>:<agentId>` 按前缀视为已注册。
        - name: lang
          in: query
          schema:
            type: string
            default: zh
          description: 客户端语言。先支持 zh、en；缺省或不认识的按 zh。
        - name: lastEventId
          in: query
          schema:
            type: string
          description: 给不方便设 Last-Event-ID 头的客户端。与 Last-Event-ID 头效果相同。
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: 上次收到的事件序号。缓冲里还有它之后的全部事件则按主题过滤补发，否则发快照。
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: 标准 SSE 文本。每条事件的 data 为对应 schema 的 JSON。
        "400":
          description: 主题列表为空或含未注册主题
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/workspaces:
    get:
      operationId: getWorkspaces
      summary: 侧栏工作区和对话列表
      description: |
        返回当前未移除的工作区，以及每个工作区下的对话摘要。
        对话状态用 statusOf，子 Agent 计数用 subagentDigests，不读完整对话记录。
        每个工作区下的对话按 updatedAt 倒序。
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: 工作区和对话摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacesSnapshot"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/workspaces/{id}/conversations:
    post:
      operationId: createWorkspaceConversation
      summary: 在工作区新建对话
      description: |
        调用和旧接口相同的创建逻辑。`title` 缺省为 New conversation。
        工作区不存在或已移除时 404。成功返回新对话的 ConversationSummary。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工作区 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"
        "400":
          description: 请求体无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 工作区不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/workspaces/{id}:
    delete:
      operationId: removeWorkspace
      summary: 移除工作区
      description: |
        只隐藏工作区，磁盘文件和对话记录保留。有运行中的对话时 409 E_WS_BUSY，并返回这些对话 id。
        工作区不存在或已移除时 404。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工作区 id
      responses:
        "200":
          description: 已移除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRemoved"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 工作区不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "409":
          description: 有运行中的对话，不能移除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBusy"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/workspaces/{id}/tree:
    get:
      operationId: getWorkspaceTree
      summary: 工作区文件树
      description: |
        复用 listWorkspaceTree：最多 500 条、深度 8，跳过 .git 和 node_modules。
        达到条数上限时 truncated 为 true。path 相对工作区，统一用 `/`。
        越界的符号链接跳过。工作区不存在或已移除 404。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工作区 id
      responses:
        "200":
          description: 文件树
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileTree"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "403":
          description: 路径越界
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 工作区不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/workspaces/{id}/files:
    get:
      operationId: getWorkspaceFile
      summary: 读工作区文件
      description: |
        返回 FileContent。超过 2 MB（环境变量 WEFT_V2_MAX_FILE_BYTES，仅测试用）时 tooLarge 为 true、text 为 null。
        前 8 KB 里有 NUL 字节或不是合法 UTF-8 时 binary 为 true、text 为 null。
        version 是内容 sha256 的十六进制前 16 位，保存时用来检测冲突。
        越界 403 E_SANDBOX；不存在 404；是目录 400。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工作区 id
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: 相对工作区的文件路径
      responses:
        "200":
          description: 文件内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "400":
          description: 路径是目录或缺少 path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "403":
          description: 路径越界
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 工作区或文件不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
    put:
      operationId: saveWorkspaceFile
      summary: 保存工作区文件
      description: |
        请求体 `{ path, text, baseVersion? }`。带了 baseVersion 且和磁盘当前内容的 version 不同时
        返回 409 `{ error, code: E_CONFLICT, current: FileContent }`，不写入。
        否则写入（需要时建目录），返回 200 `{ path, version, added, removed }`。
        越界 403 E_SANDBOX。写入后若该文件在某个对话的变更列表里，对应 conversation 主题会重算。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工作区 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFileRequest"
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"
        "400":
          description: 请求体无效或路径是目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "403":
          description: 路径越界
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 工作区不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "409":
          description: baseVersion 与磁盘当前 version 不一致
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileConflict"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/conversations/{id}:
    get:
      operationId: getConversation
      summary: 对话完整快照
      description: |
        一次返回 ConversationView、对话流 ThreadItem 列表和工具行 ToolCall。
        组装在服务端完成。`lang` 为 zh 或 en（缺省 zh，不认识的按 zh）。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 对话 id
        - name: lang
          in: query
          schema:
            type: string
            default: zh
          description: 客户端语言。先支持 zh、en；缺省或不认识的按 zh。
      responses:
        "200":
          description: 对话快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSnapshot"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 对话不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/conversations/{id}/diff:
    get:
      operationId: getConversationDiff
      summary: 某个变更文件的结构化 diff
      description: |
        从现有 liveDiff 的 before/after 生成结构化 hunks，与旧接口 unified 内容逐行一致。
        文件过大时 tooLarge 为 true、hunks 为空。没有这个路径的变更 404。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 对话 id
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: 相对工作区的文件路径
      responses:
        "200":
          description: 结构化 diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"
        "400":
          description: 缺少 path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 对话不存在或没有这个路径的变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/conversations/{id}/messages:
    post:
      operationId: postConversationMessage
      summary: 向对话发消息
      description: |
        运行中再发就是插话（Pi Durable `whenBusy: steer`）。
        `text` 去掉首尾空白后不能为空。`requestId` 缺省时服务端生成；同一个 requestId 重复请求返回同一个 runId。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 对话 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "202":
          description: 已接受，对话开始或继续运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"
        "400":
          description: 空文字或请求体无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 对话不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "409":
          description: 对话没有工作区
          content:
