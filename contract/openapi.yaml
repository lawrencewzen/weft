    get:
      operationId: getConversationMessageImage
      summary: 取用户消息里的一张图片
      description: |
        从对话记录里取出这张图的原始字节。`messageId` 与 ThreadItemUser.id 一致，`index` 与 ThreadUserImage.index 一致。
        对话记录里的图片不会变，响应带 Cache-Control: private, max-age=31536000, immutable 和 ETag。找不到 404。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 对话 id
        - name: messageId
          in: path
          required: true
          schema:
            type: string
          description: 用户消息 id，与 thread 里 user 项的 id 相同
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: 这条消息里的第几张图
      responses:
        "200":
          description: 原始图片字节
          headers:
            Cache-Control:
              schema:
                type: string
              description: "private, max-age=31536000, immutable"
            ETag:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
