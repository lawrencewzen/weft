          description: 可选提示。原型会带「已在系统终端中打开（原型不会真的打开）」；真服务端省略，由客户端显示默认文案。
      description: POST /api/v2/workspaces/{id}/open-terminal 成功。
    WorkspaceBusy:
      type: object
      additionalProperties: false
      required:
        - error
        - code
        - conversations
      properties:
        error:
          type: string
        code:
          type: string
          const: E_WS_BUSY
        conversations:
          type: array
          items:
            type: string
          description: 正在运行、因此挡住移除的对话 id
      description: 工作区里还有运行中的对话。
    ConversationView:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - title
        - updatedAt
        - status
        - model
        - run
        - context
        - itemIds
      properties:
        id:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        updatedAt:
          type: integer
          description: 毫秒时间戳
        status:
          type: string
          enum:
            - idle
            - running
            - waiting
            - failed
          description: 按设计 6.1 归一。stopped 算 idle
        model:
          description: 解析不到时为 null
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ConversationModel"
        thinkingLevel:
          description: |
            实际生效的思考档位：对话选的经 clampThinkingLevel 处理后的值；没选则为当前模型的 defaultThinkingLevel。
            当前模型不支持思考时为 null。
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ThinkingLevel"
        run:
          $ref: "#/components/schemas/RunState"
        context:
          $ref: "#/components/schemas/ContextUsage"
        itemIds:
          type: array
          items:
            type: string
          description: 对话流 ThreadItem id 的顺序
        sends:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSend"
          description: |
            本进程内经 POST .../messages 与 .../continue 发出的提交，按先后顺序，最多保留最近 20 条。
            前端用 requestId 找到自己那条乐观上屏的消息落在哪个 entry 上，据此收回。
            还没写进对话的条目带 mode 和 text，供输入框显示排队小条、对话里显示「已插话」。
            只在写入它们的服务进程内存在。
      description: 一个对话的视图。摘要字段加上模型、运行状态、上下文和对话流顺序。
    ConversationSend:
      type: object
      additionalProperties: false
      required:
        - requestId
        - entryId
        - dropped
      properties:
        requestId:
          type: string
          description: 发送时带的幂等键（POST 请求体的 requestId）。
        entryId:
          description: |
            内核把这条输入写进对话后的 entry id，也就是对应 ThreadItem 的 id（user 气泡、subagent 报告卡片或系统提示都可能）。
            这条输入还在队列里、没有落盘时为 null。
          oneOf:
            - type: "null"
            - type: string
        dropped:
          type: boolean
          description: |
            这条输入被撤回、丢弃或提交失败，对话里不会再有对应条目（只在 entryId 为 null 时有意义）。
            服务端查到 entryId 之后就不再回查提交记录，所以 entryId 不为 null 时该值可能仍是 false。
        mode:
          type: string
          enum:
            - steer
            - queue
          description: |
            发送时的处理方式。steer 插话，queue 排队。缺省按 steer 显示。
            还没写进对话时前端靠这个决定气泡下的「已插话」还是输入框里的排队小条。
        text:
          type: string
          description: 发送时的文字，供排队小条和刷新后重建「已插话」气泡。没有则为空字符串。
      description: 一次发送在对话里的落点，供前端按 requestId 收回乐观上屏的消息。
    ConversationSnapshot:
      type: object
      additionalProperties: false
      required:
        - conversation
        - items
        - tools
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationView"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ThreadItem"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
      description: GET /api/v2/conversations/{id} 的响应。客户端按 itemIds 画对话流，按 toolIds 取工具行。
    Subagent:
      type: object
      additionalProperties: false
      required:
        - id
        - parentConversationId
        - title
        - name
        - mode
        - status
        - startedAt
        - lastActivityAt
        - endedAt
        - currentAction
        - progress
        - toolCallId
      properties:
        id:
          type: string
          description: 子 Agent id，形如 `<cid>:sub:<子对话 id>`
        parentConversationId:
          type: string
          description: 所属主对话 id
        title:
          type: string
          description: 按 title → name（空或默认名如 agent-1 则跳过）→ brief 第一行 → lastText 回退
        name:
          type: string
        mode:
          type: string
          enum:
            - foreground
            - background
        status:
          type: string
          enum:
            - waiting
            - running
            - stuck
            - done
            - stopped
            - failed
          description: kernel 的 error 归为 failed。running 且超过 stuckAfterMs 没有活动则为 stuck
        startedAt:
          description: 开始时间（毫秒）。没有则为 null
          oneOf:
            - type: "null"
            - type: integer
        lastActivityAt:
          description: 最近活动时间（毫秒）。没有则为 null
          oneOf:
            - type: "null"
            - type: integer
        endedAt:
          description: 结束时间（毫秒）。未结束则为 null
          oneOf:
            - type: "null"
            - type: integer
        currentAction:
          description: 正在做的事。非 running/stuck 或没有则为 null
          oneOf:
            - type: "null"
            - type: string
        progress:
          description: 步数。没有 step/total 则为 null
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - step
                - total
              properties:
                step:
                  type: number
                total:
                  type: number
        toolCallId:
          description: 派出该子 Agent 的那次 delegate / subagent 工具调用 id，与对话快照里 ToolCall.id 一致。从 roster 里来、找不到对应工具调用时为 null
          oneOf:
            - type: "null"
            - type: string
      description: 侧栏和子线程里的子 Agent 视图。卡住由服务端判定。
    SubagentSnapshot:
      type: object
      additionalProperties: false
      required:
        - subagent
        - items
        - tools
      properties:
        subagent:
          $ref: "#/components/schemas/Subagent"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ThreadItem"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
      description: GET /api/v2/conversations/{id}/subagents/{agentId} 的响应。
    ChangeByMain:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - main
      description: 最后一次 write/edit 这个文件的是主 Agent。
    ChangeBySubagent:
      type: object
      additionalProperties: false
      required:
        - kind
        - agentId
        - name
      properties:
        kind:
          type: string
          enum:
            - subagent
        agentId:
          type: string
          description: 子 Agent id，形如 `<cid>:sub:<子对话 id>`
        name:
          type: string
          description: 子 Agent 名。前端显示成「子 · <name>」
      description: 最后一次 write/edit 这个文件的是某个子 Agent。
    Change:
      type: object
      additionalProperties: false
      required:
        - path
        - added
        - removed
        - error
        - by
      properties:
        path:
          type: string
          description: 相对工作区的路径，统一用 `/`
        added:
          type: integer
        removed:
          type: integer
        error:
          description: 例如文件过大。没有则为 null
          oneOf:
            - type: "null"
            - type: string
        by:
          description: 最后一次 write/edit 这个文件的是谁。主 Agent 和子 Agent 都改过时取最后一次。只被 bash 等非 write/edit 工具改、拿不到归属时为 null
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ChangeByMain"
            - $ref: "#/components/schemas/ChangeBySubagent"
      description: 对话右栏变更列表的一项。SSE conversation 主题里 entity=change，id 为 path。
    DiffLine:
      type: object
      additionalProperties: false
      required:
        - op
        - text
        - oldLine
        - newLine
      properties:
        op:
          type: string
          enum:
            - ctx
            - add
            - del
        text:
          type: string
          description: 不含换行符的一行
        oldLine:
          description: 旧文件行号（1 起）。add 为 null
          oneOf:
            - type: "null"
            - type: integer
        newLine:
          description: 新文件行号（1 起）。del 为 null
          oneOf:
            - type: "null"
            - type: integer
    DiffHunk:
      type: object
      additionalProperties: false
      required:
        - oldStart
        - oldLines
        - newStart
        - newLines
        - lines
      properties:
        oldStart:
          type: integer
        oldLines:
          type: integer
        newStart:
          type: integer
        newLines:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DiffLine"
    Diff:
      type: object
      additionalProperties: false
      required:
        - path
        - added
        - removed
        - hunks
        - tooLarge
      properties:
        path:
          type: string
          description: 相对工作区的路径，统一用 `/`
        added:
          type: integer
        removed:
          type: integer
        hunks:
          type: array
          items:
            $ref: "#/components/schemas/DiffHunk"
        tooLarge:
          type: boolean
          description: 文件过大时为 true，此时 hunks 为空
      description: GET /api/v2/conversations/{id}/diff 的响应。
    FileNode:
      type: object
      additionalProperties: false
      required:
        - path
        - type
      properties:
        path:
          type: string
          description: 相对工作区的路径，统一用 `/`
        type:
          type: string
          enum:
            - file
            - dir
      description: 工作区文件树的一项。
    FileTree:
      type: object
      additionalProperties: false
      required:
        - entries
        - truncated
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileNode"
        truncated:
          type: boolean
          description: 达到 500 条上限时为 true
      description: GET /api/v2/workspaces/{id}/tree 的响应。
    FileContent:
      type: object
      additionalProperties: false
      required:
        - path
        - size
        - binary
        - tooLarge
        - text
        - version
      properties:
        path:
          type: string
          description: 相对工作区的路径，统一用 `/`
        size:
          type: integer
          description: 字节数
        binary:
          type: boolean
        tooLarge:
          type: boolean
        text:
          description: 文本内容。binary 或 tooLarge 时为 null
          oneOf:
            - type: "null"
            - type: string
        version:
          type: string
          description: 内容 sha256 十六进制前 16 位
      description: GET /api/v2/workspaces/{id}/files 的响应。
    SaveFileRequest:
      type: object
      additionalProperties: false
      required:
        - path
        - text
      properties:
        path:
          type: string
        text:
          type: string
        baseVersion:
          type: string
          description: 上次读到的 version。带了且与磁盘当前不同则 409，不写入
      description: PUT /api/v2/workspaces/{id}/files 的请求体。
    SaveResult:
      type: object
      additionalProperties: false
      required:
        - path
        - version
        - added
        - removed
      properties:
        path:
          type: string
        version:
          type: string
        added:
          type: integer
        removed:
          type: integer
      description: PUT /api/v2/workspaces/{id}/files 成功。
    FileConflict:
      type: object
      additionalProperties: false
      required:
        - error
        - code
        - current
      properties:
        error:
          type: string
        code:
          type: string
          const: E_CONFLICT
        current:
          $ref: "#/components/schemas/FileContent"
      description: 保存时 baseVersion 过期。
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - source
      properties:
        name:
          type: string
        source:
          type: string
          enum:
            - local
            - git
        path:
          type: string
          description: source=local 时的本机目录。缺省则在数据目录下建空目录
        gitUrl:
          type: string
          description: source=git 时的仓库地址
        branch:
          type: string
        connectionId:
          type: string
        projectId:
          description: GitLab 项目 id，需同时带 connectionId
          oneOf:
            - type: string
            - type: integer
      description: POST /api/v2/workspaces 的请求体。
    WorkspaceCreateError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: 按 lang 出成句
        code:
          type: string
        allowedRoot:
          type: string
        detail:
          type: string
        via:
          type: string
      description: 新建工作区失败。路径越界带 allowedRoot；Git 失败带 code / via。
    GitCloneFailure:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: 按 lang 出成句
        code:
          type: string
          description: git_not_found、auth_failed、cert_failed 等，与旧接口相同
        detail:
          type: string
        via:
          type: string
      description: Git 克隆或 GitLab API 失败。
    WorkspaceRoot:
      type: object
      additionalProperties: false
      required:
        - root
      properties:
        root:
          type: string
      description: GET /api/v2/workspace-root。
    WorkspaceDirs:
      type: object
      additionalProperties: false
      required:
        - root
        - path
        - parent
        - selectable
        - git
        - entries
        - truncated
      properties:
        root:
          type: string
        path:
          type: string
        parent:
          description: 已在根目录时为 null
          oneOf:
            - type: "null"
            - type: string
        selectable:
          type: boolean
        git:
          type: boolean
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceDirEntry"
        truncated:
          type: boolean
      description: GET /api/v2/workspace-root/dirs。
    WorkspaceDirEntry:
      type: object
      additionalProperties: false
      required:
        - name
        - path
        - git
      properties:
        name:
          type: string
        path:
          type: string
        git:
          type: boolean
    PathNotAllowed:
      type: object
      additionalProperties: false
      required:
        - error
        - code
        - allowedRoot
      properties:
        error:
          type: string
          description: 按 lang 出成句
        code:
          type: string
          const: E_PATH
        allowedRoot:
          type: string
      description: 本地路径不在允许范围内。
    Plugin:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - version
        - source
        - enabled
        - loaded
        - error
        - errorCode
        - tools
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        source:
          type: string
        enabled:
          type: boolean
        loaded:
          type: boolean
        error:
          description: 失败原因成句。正常为 null
          oneOf:
            - type: "null"
            - type: string
        errorCode:
          description: 结构化失败码。正常为 null
          oneOf:
            - type: "null"
            - type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/PluginTool"
      description: 插件。失败原因由服务端按 lang 出成句。
    PluginTool:
      type: object
      additionalProperties: false
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
    PluginList:
      type: object
      additionalProperties: false
      required:
        - plugins
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/Plugin"
    InstallPluginRequest:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
      description: 本机插件目录。
    PatchPluginRequest:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
    Skill:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - version
        - source
        - enabled
        - deletable
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        source:
          type: string
        enabled:
          type: boolean
        deletable:
          type: boolean
      description: 技能。写失败时的原因在 CatalogError 里按 lang 出成句。
    SkillList:
      type: object
      additionalProperties: false
      required:
        - skills
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
    SkillWriteRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        body:
          type: string
        enabled:
          type: boolean
    CatalogError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: 按 lang 出成句
        code:
          type: string
          description: err_plugin_* / err_skill_*，与旧接口相同
      description: 插件或技能写操作失败。
    GitConnection:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - baseUrl
        - token
        - hasToken
        - allowHttp
        - caFile
        - lastTest
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
            - gitlab-self
            - gitlab-com
            - other
        baseUrl:
          type: string
        token:
          type: string
          description: 打码后的令牌，不含明文
        hasToken:
          type: boolean
        allowHttp:
          type: boolean
        caFile:
          type: string
        lastTest:
          description: 尚未测试时为 null
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/GitConnectionLastTest"
