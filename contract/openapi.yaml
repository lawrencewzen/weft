  /api/v2/providers/{id}/connect:
    post:
      operationId: connectProvider
      summary: 接入内置 Provider
      description: |
        `method=api_key` 或 `env`：用该 Provider 第一个启用的模型（没有启用的就用目录第一个 chat 模型）发一次 max_tokens=1 的请求；
        验证通过后 `{ provider }`。新接入的内置 Provider 默认启用：模型 ≤6 个时全部，否则一个都不启用。
        验证失败 400 `{ error, code: E_AUTH | E_NETWORK | E_HTTP }`，不保存凭据。
        `method=oauth`：开始登录会话，返回 `{ session }`。同一 Provider 同时只允许一个进行中的会话。
        `method=local_login`：仅 xai。把本机 Grok CLI（`~/.grok/auth.json`）的凭据转换成 pi-ai xai OAuth 凭据后写入 CredentialStore，再探测。响应不含 token。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 内置 Provider id
        - name: lang
          in: query
          schema:
            type: string
            default: zh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectProviderRequest"
      responses:
        "200":
          description: 已接入或已开始登录会话
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProviderEnvelope"
                  - $ref: "#/components/schemas/LoginSessionEnvelope"
        "400":
          description: 验证失败或请求体无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: Provider 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
