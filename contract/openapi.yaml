        自定义：重新拉 /models 并合并，已启用和覆盖保留。
        结果写进 lastTest，推送 providers 主题。响应不含明文 key。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Provider id
        - name: lang
          in: query
          schema:
            type: string
            default: zh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: 更新后的 Provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderEnvelope"
        "400":
          description: 测试失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: Provider 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
