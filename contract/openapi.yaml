    GitConnectionWrite:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        baseUrl:
          type: string
        token:
          type: string
        allowHttp:
          type: boolean
        caFile:
          type: string
    GitConnectionInvalid:
      type: object
      additionalProperties: false
