  /api/v2/conversations:
    post:
      operationId: createConversation
      summary: 不选项目新建对话
      description: |
        不带 workspaceId。服务端先建一个 kind=chat 的工作区，目录为数据目录下 `chats/<对话id>`，
        名字用请求里的 title，没有则按 `lang` 用「对话」/「Chat」，再在该工作区下建对话。
        目录在建对话时创建。成功返回 ConversationSummary，`workspaceId` 指向这个 chat 工作区。
        已有工作区下建对话仍走 POST /api/v2/workspaces/{id}/conversations。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            default: zh
          description: 客户端语言。先支持 zh、en；缺省或不认识的按 zh。chat 工作区默认名随语言。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"
        "400":
          description: 请求体无效
          content:
