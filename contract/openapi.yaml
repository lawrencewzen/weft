        - path
        - source
        - gitUrl
        - branch
        - git
        - conversationCount
        - runningCount
        - kind
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        source:
          type: string
          enum:
            - local
            - git
        gitUrl:
          description: Git 导入时去掉凭据后的仓库地址。本地工作区为 null
          oneOf:
            - type: "null"
            - type: string
        branch:
          description: Git 导入时的分支。本地工作区或未指定分支为 null
          oneOf:
            - type: "null"
            - type: string
        git:
          description: 工作区当前 git 状态。不是 git 仓库或未安装 git 时为 null
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/GitStatus"
        conversationCount:
          type: integer
          minimum: 0
          description: 该工作区下的对话数
        runningCount:
          type: integer
          minimum: 0
          description: 状态为 running 的对话数（recovering、resuming 算 running）
        kind:
          type: string
          enum:
            - project
            - chat
          description: project 是用户添加的项目目录；chat 是无项目对话自动创建的工作目录
      description: 侧栏工作区。kind 为 project（项目）或 chat（不选项目的对话目录）。
    GitStatus:
      type: object
      additionalProperties: false
      required:
        - branch
        - detached
        - changedFiles
        - insertions
        - deletions
        - ahead
        - behind
      properties:
        branch:
          type: string
          description: 当前分支名。detached HEAD 时为短 sha
        detached:
          type: boolean
          description: detached HEAD 时为 true
        changedFiles:
          type: integer
          minimum: 0
          description: 未提交改动的文件数，含未跟踪的文件
        insertions:
          type: integer
          minimum: 0
          description: 相对 HEAD 的未提交插入行数（git diff --numstat HEAD；二进制不计）
        deletions:
          type: integer
          minimum: 0
          description: 相对 HEAD 的未提交删除行数（git diff --numstat HEAD；二进制不计）
        ahead:
          description: 领先上游的提交数。没有上游时为 null
          oneOf:
            - type: "null"
            - type: integer
              minimum: 0
        behind:
          description: 落后上游的提交数。没有上游时为 null
          oneOf:
            - type: "null"
            - type: integer
              minimum: 0
      description: 工作区实时 git 状态。
    SubagentCounts:
      type: object
      additionalProperties: false
      required:
        - total
        - live
      properties:
        total:
          type: integer
          minimum: 0
        live:
          type: integer
          minimum: 0
      description: 子 Agent 总数和正在跑的数量。没有子 Agent 时 ConversationSummary.subagents 为 null。
    ConversationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - title
        - updatedAt
        - status
        - runningAgents
        - subagents
        - archived
      properties:
        id:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        updatedAt:
          type: integer
          description: 毫秒时间戳
        status:
          type: string
          enum:
            - idle
            - running
            - waiting
            - failed
          description: 按设计 6.1 归一。recovering、resuming 算 running；paused 算 waiting；error 算 failed；stopped 算 idle
        runningAgents:
          type: integer
          minimum: 0
          description: 主 Agent 运行算 1，加上运行中的子 Agent 数。与旧版 conversationMeta「N 个 Agent 运行中」一致
        subagents:
          description: 没有子 Agent 时为 null
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SubagentCounts"
        archived:
          type: boolean
      description: 侧栏对话摘要。
    WorkspacesSnapshot:
      type: object
      additionalProperties: false
      required:
        - workspaces
