        `name` 只取 basename，去掉控制字符和路径分隔符，空名用 `file`。
        单个文件解码后上限 20MB，超了 413。第一次创建 `.weft/` 时写入 `.weft/.gitignore`，内容是 `*`。
        返回相对工作区、正斜杠的 path，发消息时放进 `files`。工作区不存在或已删除 404。
      security:
        - bearerAuth: []
        - sessionCookie: []
