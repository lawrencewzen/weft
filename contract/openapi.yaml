        - error
        - errorText
        - at
      properties:
        ok:
          type: boolean
        username:
          type: string
        error:
          type: string
          description: 失败码。成功时为空字符串
        errorText:
          type: string
          description: 按 lang 出成句
        at:
          type: string
    GitConnectionList:
      type: object
      additionalProperties: false
      required:
        - connections
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/GitConnection"
    GitConnectionWrite:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        baseUrl:
          type: string
        token:
          type: string
        allowHttp:
          type: boolean
        caFile:
          type: string
    GitConnectionInvalid:
      type: object
      additionalProperties: false
      required:
        - error
        - errors
      properties:
        error:
          type: string
          description: 按 lang 出成句
        code:
          type: string
        errors:
          type: array
          items:
            type: string
          description: 与旧接口相同的字段级错误（name required 等）
    GitTestResult:
      type: object
      additionalProperties: false
      required:
        - ok
        - username
        - code
