          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
    patch:
      operationId: patchConversation
      summary: 切换对话模型或思考档位
      description: |
        `model` 为 `{ providerId, modelId }` 时绑定该模型，规则同旧 resolveConversationModelPatch。
        `model` 为 null 时回到默认。`thinkingLevel` 为档位名时写入对话；对当前模型不支持的档位按 clampThinkingLevel 就近处理，响应里的 thinkingLevel 是实际生效值。`thinkingLevel` 为 null 时清除，恢复模型默认。至少要有 model 或 thinkingLevel。运行中也能改，下次提交生效。成功后推送该对话主题的 ConversationView（含 model、thinkingLevel 和 context）。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 对话 id
        - name: lang
          in: query
          schema:
            type: string
