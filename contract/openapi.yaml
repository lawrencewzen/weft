openapi: 3.1.0
info:
  title: Weft v2
  version: "2.0.0"
  description: Weft v2 HTTP 契约。本文件是协议的唯一依据。
paths:
  /api/v2/service:
    get:
      operationId: getService
      summary: 查询服务信息
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: 当前进程的服务信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/service/restart:
    post:
      operationId: restartService
      summary: 请求服务退出，由客户端重新拉起
      description: |
        服务只负责退出当前进程，不负责再拉起。客户端在收到 202 后自行启动新进程。
        任务图里还有活着的任务（含后台子 Agent）时返回 409，避免打断正在跑的工作。
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "202":
          description: 已接受，服务即将退出。重新拉起由客户端完成。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartAccepted"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "409":
          description: 有活着的任务，此时不能退出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/auth/web-code:
    post:
      operationId: createWebCode
      summary: 用本机令牌签发一次性网页登录码
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: 一次性登录码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebCode"
        "400":
          description: 请求体不是 JSON 对象
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权（仅接受 Bearer 本机令牌）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "413":
          description: 请求体过大
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/events:
    get:
      operationId: getEvents
      summary: SSE 推送流
      description: |
        一个客户端一条 SSE 连接，用查询参数 `topics` 订阅主题（逗号分隔），`lang` 为 zh 或 en（缺省 zh，不认识的按 zh）。
        每条业务事件带全局递增序号，写成标准 SSE：`id: <序号>`、`event: <类型>`、`data: <JSON>`。
        断线后带 `Last-Event-ID` 头（或查询参数 `lastEventId`）续传；环形缓冲里补不上（太旧、比当前还新、或格式不对）时先发一份新快照。
        没带 Last-Event-ID 时先发快照。快照的 SSE id 是开始计算快照时的最新序号；计算期间该连接订阅主题上到达的事件在快照之后按序补发（seq 大于该 id）。upsert / remove 是整实体替换，重复应用结果一样。
        订阅的主题和上次不同时，客户端不要带 Last-Event-ID / lastEventId，直接重新连接拿快照（续传只保证同一组主题）。
        心跳每 15 秒一次，不带 id，不进缓冲。

        主题 `workspaces` 注册为精确主题。实体：
        - `workspace`：id 为工作区 id，值为 Workspace（含可选 git 状态）
        - `conversation_summary`：id 为对话 id，值为 ConversationSummary

        快照与 GET /api/v2/workspaces 同一套数据拆成上述实体。工作区或对话增删改、运行状态、子 Agent 计数或 git 状态变化时 upsert；实体删除时 remove。值没变不推送。

        主题 `providers` 注册为精确主题。实体：
        - `provider`：id 为 Provider id，值为 Provider
        - `defaults`：id 为 `self`，值为 ProviderDefaults（`model` 为当前默认 `{ providerId, modelId }`，没有则为 null）

        快照是 GET /api/v2/providers 的 providers 与 defaultModel 拆成上述实体。任何 Provider 增删改（接入、自定义接口、测试、PATCH、删除）或默认模型修改后 upsert；实体删除时 remove。登录会话不进主题，靠轮询 GET /api/v2/login-sessions/{sid}。密钥永不明文出现在响应或推送里。

        主题 `extensions` 注册为精确主题。实体：
        - `plugin`：id 为插件 id，值为 Plugin
        - `skill`：id 为技能 id，值为 Skill
        - `git_connection`：id 为 Git 连接 id，值为 GitConnection

        快照是 GET /api/v2/plugins、GET /api/v2/skills、GET /api/v2/git/connections 同一套数据拆成上述实体。插件、技能、Git 连接增删改（含旧接口）后 upsert；实体删除时 remove。失败原因、Git 测试结果按订阅的 `lang` 出成句。

        主题 `conversation:<id>`（`<id>` 为对话 id）按前缀动态注册。实体：
        - `conversation`：id 为对话 id，值为 ConversationView
        - `item`：id 为 ThreadItem.id，值为 ThreadItem
        - `tool`：id 为 ToolCall.id，值为 ToolCall
        - `subagent`：id 为子 Agent id，值为 Subagent。卡住由服务端判定：kernel 状态为 running 且超过 stuckAfterMs（默认 60000，环境变量 WEFT_SUBAGENT_STUCK_MS）没有活动时 status 为 stuck，到点推送 upsert。
        - `change`：id 为相对工作区的路径（统一用 `/`），值为 Change。快照带上当前变更列表。工具结束（write / edit / bash 都可能改文件）或经保存接口写入后随重算更新：变了才 upsert，从列表消失则 remove。不做文件监听。

        快照是 GET /api/v2/conversations/{id} 的 conversation / items / tools，再加上该对话的 subagent 和 change 实体。模型流式输出时先 upsert 一条 `item`，id 以 `live:` 开头、`streaming` 为 true、`text` 为空；随后用 `text.delta` 追加。正式助手消息到来后 remove 这条流式项，再 upsert 正式项和 conversation。bash 工具运行中用 `tool.delta` 追加保留窗口（不要复用 `text.delta`）；偏移对不上时客户端丢掉本地缓冲，等下一次 upsert。

        主题 `subagent:<cid>:<agentId>`（`<cid>` 为父对话 id，`<agentId>` 为子 Agent id）按前缀动态注册。实体：
        - `subagent`：id 为子 Agent id，值为 Subagent
        - `item`：id 为 ThreadItem.id，值为 ThreadItem（子 Agent 自己的消息流，没有嵌套子 Agent 汇报）
        - `tool`：id 为 ToolCall.id，值为 ToolCall

        快照是 GET /api/v2/conversations/{id}/subagents/{agentId} 同一套数据拆成上述实体。订阅父对话的内核事件（含 `agent`）后重算；子 Agent 的进展会体现在父对话事件里。

        订阅不存在的对话或子 Agent 时仍返回 200：先发 snapshot，entities 为空，并在 snapshot 数据里加 `missing: ["conversation:<id>"]` 或 `missing: ["subagent:<cid>:<agentId>"]`，连接保持。

        事件名与 data 的对应关系：
        - `snapshot` → SnapshotEvent
        - `upsert` → UpsertEvent
        - `remove` → RemoveEvent
        - `text.delta` → TextDeltaEvent
        - `tool.delta` → ToolDeltaEvent
        - `heartbeat` → HeartbeatEvent
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: topics
          in: query
          required: true
          schema:
            type: string
          description: 逗号分隔的主题列表。空或含未注册主题时 400。`workspaces`、`providers`、`extensions` 已注册；`conversation:<id>` 和 `subagent:<cid>:<agentId>` 按前缀视为已注册。
        - name: lang
          in: query
          schema:
            type: string
            default: zh
          description: 客户端语言。先支持 zh、en；缺省或不认识的按 zh。
        - name: lastEventId
          in: query
          schema:
            type: string
          description: 给不方便设 Last-Event-ID 头的客户端。与 Last-Event-ID 头效果相同。
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: 上次收到的事件序号。缓冲里还有它之后的全部事件则按主题过滤补发，否则发快照。
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: 标准 SSE 文本。每条事件的 data 为对应 schema 的 JSON。
        "400":
          description: 主题列表为空或含未注册主题
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/workspaces:
    get:
      operationId: getWorkspaces
      summary: 侧栏工作区和对话列表
      description: |
        返回当前未移除的工作区，以及每个工作区下的对话摘要。
        对话状态用 statusOf，子 Agent 计数用 subagentDigests，不读完整对话记录。
        每个工作区下的对话按 updatedAt 倒序。
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: 工作区和对话摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacesSnapshot"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
    post:
      operationId: createWorkspace
      summary: 新建工作区
      description: |
        请求体带 `source`：`local` 用本机目录（`path` 缺省时在数据目录下建空目录），`git` 克隆仓库。
        本地路径校验与旧接口相同（resolveAllowedWorkspacePath）。Git 只允许 https / ssh / git@；存储的 URL 去掉凭据。
        `connectionId` / `projectId` 走已保存的 Git 连接。成功后 `workspaces` 主题更新。失败原因按 `lang` 出成句，并带结构化 `code`。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            default: zh
          description: 失败文案语言。zh 或 en；缺省或不认识的按 zh。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: 名称、路径或 Git 地址无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceCreateError"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: Git 连接不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/workspace-root:
    get:
      operationId: getWorkspaceRoot
      summary: 可浏览的工作区根目录
      description: 与旧 GET /api/workspace-root 相同，返回 defaultWorkspaceRoot()。
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: 根目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRoot"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/workspace-root/dirs:
    get:
      operationId: listWorkspaceRootDirs
      summary: 列出可浏览的子目录
      description: |
        与旧 GET /api/workspace-root/dirs 相同，复用 listBrowsableDirs。
        只列出允许根目录以内的文件夹；越界 400 E_PATH，文案按 lang 出成句。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: path
          in: query
          schema:
            type: string
          description: 要列出的目录。缺省为工作区根目录。
        - name: lang
          in: query
          schema:
            type: string
            default: zh
      responses:
        "200":
          description: 当前目录和子文件夹
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDirs"
        "400":
          description: 路径不允许
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathNotAllowed"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 路径不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathNotAllowed"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/git/connections:
    get:
      operationId: listGitConnections
      summary: Git 连接列表
      description: 令牌只返回打码值。lastTest.errorText 按 lang 出成句。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            default: zh
      responses:
        "200":
          description: 连接列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitConnectionList"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
    post:
      operationId: createGitConnection
      summary: 新建 Git 连接
      description: 令牌只返回打码值。成功后 extensions 主题更新。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            default: zh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitConnectionWrite"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitConnection"
        "400":
          description: 连接字段无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitConnectionInvalid"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/git/connections/test:
    post:
      operationId: testGitConnectionUnsaved
      summary: 测试尚未保存或正在编辑的 Git 连接
      description: |
        与旧 POST /api/git/connections/test 相同。校验失败也返回 200 `{ ok: false, code }`，
        由服务端按 lang 出成句（statusText）。令牌不出现在响应里。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            default: zh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitConnectionWrite"
      responses:
        "200":
          description: 测试结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitTestResult"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 带了 id 但连接不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/git/connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        schema:
          type: string
          default: zh
    patch:
      operationId: updateGitConnection
      summary: 更新 Git 连接
      description: 打码令牌视为未改。成功后 extensions 主题更新。
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitConnectionWrite"
      responses:
        "200":
          description: 更新后的连接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitConnection"
        "400":
          description: 连接字段无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitConnectionInvalid"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 连接不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
    delete:
      operationId: deleteGitConnection
      summary: 删除 Git 连接
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkId"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 连接不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/git/connections/{id}/test:
    post:
      operationId: testGitConnection
      summary: 测试已保存的 Git 连接并记下结果
