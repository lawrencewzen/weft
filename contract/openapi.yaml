          oneOf:
            - type: string
            - type: integer
        path:
          type: string
        description:
          type: string
        defaultBranch:
          type: string
        lastActivityAt:
          type: string
        httpUrl:
          type: string
          description: 去掉凭据后的 http 克隆地址
    GitProjectList:
      type: object
      additionalProperties: false
      required:
        - projects
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/GitProject"
    GitBranch:
      type: object
      additionalProperties: false
      required:
        - name
        - default
      properties:
        name:
          type: string
        default:
          type: boolean
    GitBranchList:
      type: object
      additionalProperties: false
      required:
        - branches
        - defaultBranch
      properties:
        branches:
          type: array
          items:
            $ref: "#/components/schemas/GitBranch"
        defaultBranch:
          type: string
    OkId:
      type: object
      additionalProperties: false
      required:
        - ok
        - id
      properties:
        ok:
          type: boolean
          const: true
        id:
          type: string
      description: 删除成功。
