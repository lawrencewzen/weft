  /api/v2/workspaces/{id}/git/refresh:
    post:
      operationId: refreshWorkspaceGit
      summary: 刷新工作区 git 状态
      description: |
        用 git（execFile，无 shell，约 3 秒超时）读取工作区当前分支、未提交改动和相对上游的 ahead/behind。
        不是 git 仓库或未安装 git 时 `git` 为 null，不报错。同一工作区并发刷新合并为一次，避免同时起多个 git 进程。
        kind=chat 的工作区不跑 git，直接返回 `git` 为 null。
        值变化时通过 `workspaces` 主题 upsert 该 Workspace。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工作区 id
      responses:
        "200":
          description: 刷新后的工作区（含最新 git）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 工作区不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
