  /api/v2/workspaces/{id}/tree:
    get:
      operationId: getWorkspaceTree
      summary: 工作区文件树
      description: |
        复用 listWorkspaceTree：最多 500 条、深度 8，跳过 .git 和 node_modules。
        达到条数上限时 truncated 为 true。path 相对工作区，统一用 `/`。
        越界的符号链接跳过。工作区不存在或已移除 404。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工作区 id
      responses:
        "200":
          description: 文件树
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileTree"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "403":
          description: 路径越界
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 工作区不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/workspaces/{id}/files:
    get:
      operationId: getWorkspaceFile
      summary: 读工作区文件
      description: |
        返回 FileContent。超过 2 MB（环境变量 WEFT_V2_MAX_FILE_BYTES，仅测试用）时 tooLarge 为 true、text 为 null。
        前 8 KB 里有 NUL 字节或不是合法 UTF-8 时 binary 为 true、text 为 null。
        version 是内容 sha256 的十六进制前 16 位，保存时用来检测冲突。
        越界 403 E_SANDBOX；不存在 404；是目录 400。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工作区 id
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: 相对工作区的文件路径
      responses:
        "200":
          description: 文件内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "400":
          description: 路径是目录或缺少 path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "403":
          description: 路径越界
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 工作区或文件不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
    put:
      operationId: saveWorkspaceFile
      summary: 保存工作区文件
      description: |
        请求体 `{ path, text, baseVersion? }`。带了 baseVersion 且和磁盘当前内容的 version 不同时
        返回 409 `{ error, code: E_CONFLICT, current: FileContent }`，不写入。
        否则写入（需要时建目录），返回 200 `{ path, version, added, removed }`。
        越界 403 E_SANDBOX。写入后若该文件在某个对话的变更列表里，对应 conversation 主题会重算。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工作区 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFileRequest"
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"
        "400":
          description: 请求体无效或路径是目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "403":
          description: 路径越界
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 工作区不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "409":
          description: baseVersion 与磁盘当前 version 不一致
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileConflict"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/providers:
    get:
      operationId: getProviders
      summary: 已接入的模型 Provider 和默认模型
      description: |
        返回当前 settings.providers 里的 Provider 视图，以及默认模型。
        `defaultModel` 是实际会用的默认：已显式设置且仍有效则用它，未显式设置时为自动选择的第一个可用模型。
        `status.error` 按 `lang` 出成句。密钥只以 auth.keyTail（末 4 位）出现，响应不含明文 key。
        界面上不出现「pi-ai」字样。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            default: zh
          description: 客户端语言。先支持 zh、en；缺省或不认识的按 zh。
      responses:
        "200":
          description: Provider 快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersSnapshot"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/providers/available:
    get:
      operationId: getAvailableProviders
      summary: 可接入的内置 Provider 目录
      description: |
        返回全部内置 Provider（排除 openai-codex、radius、typesafe；github-copilot 等去掉 oauth 后无认证方式的也不返回）。
        xai 显示为 Grok，authMethods 只有 oauth，并带 `localLogin`（本机 Grok CLI 登录检测，不含 token）。
        其余 Provider 的 authMethods 不含 oauth（界面只走 API Key）。
        popular 优先（固定顺序），其余按 name 排序。
        `envVar` / `envDetected` 按内置 Provider 的环境变量规则；`connected` 表示已在 settings.providers 里。
        中文环境下少量本地化名：moonshotai-cn、zai、qwen-token-plan-cn、minimax-cn、xiaomi；xai 中英文都叫 Grok。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            default: zh
      responses:
        "200":
          description: 可接入目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableProvidersSnapshot"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/providers/custom:
    post:
      operationId: createCustomProvider
      summary: 新增自定义接口
      description: |
        先 GET `{baseUrl}/models`，成功才保存。拉到的模型 ≤6 个全启用，否则都不启用。
        失败 400 不保存。成功后推送 providers 主题。
      security:
