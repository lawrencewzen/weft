          description: 已写入工作区
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: 请求体无效或 data 不是合法 base64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
