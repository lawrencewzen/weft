        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/conversations/{id}/stop:
    post:
      operationId: stopConversation
      summary: 停止对话
      description: 对话不存在 404。不在运行也返回 202，幂等。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 对话 id
      responses:
        "202":
          description: 已接受停止（含本就未在运行）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopAccepted"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 对话不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/conversations/{id}/continue:
    post:
      operationId: continueConversation
      summary: 点「继续」
      description: |
        等同于发送 MANUAL_CONTINUE_TEXT（「继续」）。
        `requestId` 缺省时服务端生成；同一个 requestId 重复请求返回同一个 runId。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 对话 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinueRequest"
      responses:
        "202":
          description: 已接受
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"
        "400":
          description: 请求体无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 对话不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "409":
          description: 对话没有工作区
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/conversations/{id}/tools/{toolId}/output:
    get:
      operationId: getToolOutput
      summary: 某次工具调用的完整输出
      description: |
        返回完整输出文字。工作区绝对路径替换成相对路径。
        对话或工具不存在 404。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 对话 id
        - name: toolId
          in: path
          required: true
          schema:
            type: string
          description: 工具调用 id
      responses:
        "200":
          description: 完整输出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolOutput"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 对话或工具不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/conversations/{id}/subagents/{agentId}:
    get:
      operationId: getSubagent
      summary: 子 Agent 线程快照
      description: |
        返回 Subagent 视图，以及用子 Agent 自己的消息组装的 ThreadItem / ToolCall。
        子 Agent 没有嵌套的子 Agent 汇报。`lang` 为 zh 或 en（缺省 zh，不认识的按 zh）。
        对话或子 Agent 不存在 404。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 父对话 id
        - name: agentId
          in: path
          required: true
          schema:
            type: string
          description: 子 Agent id，形如 `<cid>:sub:<子对话 id>`
        - name: lang
          in: query
          schema:
            type: string
            default: zh
          description: 客户端语言。先支持 zh、en；缺省或不认识的按 zh。
      responses:
        "200":
          description: 子 Agent 线程快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubagentSnapshot"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 对话或子 Agent 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/conversations/{id}/subagents/{agentId}/messages:
    post:
      operationId: postSubagentMessage
      summary: 给子 Agent 发消息
      description: |
        调用内核 `sendToAgent`。`text` 去掉首尾空白后不能为空。
        对话或子 Agent 不存在 404。子 Agent 不在 running 时 409。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 父对话 id
        - name: agentId
          in: path
          required: true
          schema:
            type: string
          description: 子 Agent id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "202":
          description: 已接受
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubagentMessageAccepted"
        "400":
          description: 空文字或请求体无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 对话或子 Agent 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "409":
          description: 子 Agent 不在运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
  /api/v2/conversations/{id}/subagents/{agentId}/stop:
    post:
      operationId: stopSubagent
      summary: 停止子 Agent
      description: 对话或子 Agent 不存在 404。不在运行也返回 202，幂等。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 父对话 id
        - name: agentId
          in: path
          required: true
          schema:
            type: string
          description: 子 Agent id
      responses:
        "202":
          description: 已接受停止（含本就未在运行）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopAccepted"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 对话或子 Agent 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 发现文件里的本机令牌
    sessionCookie:
      type: apiKey
      in: cookie
      name: weft_session
      description: 网页端一次性码换来的会话 cookie
  schemas:
    ServiceInfo:
      type: object
      additionalProperties: false
      required:
        - protocolVersion
        - serviceVersion
        - pid
        - startedAt
        - demo
      properties:
        protocolVersion:
          type: string
        serviceVersion:
          type: string
        pid:
          type: integer
        startedAt:
          type: integer
          description: 进程启动时间（毫秒时间戳）
        demo:
          type: boolean
          description: 走本地剧本（WEFT_LLM=faux / LLM_API=faux / WEFT_FAUX_SCRIPT）时为 true，界面要标出「演示模型」
    RestartAccepted:
      type: object
      additionalProperties: false
      required:
        - exiting
      properties:
        exiting:
          type: boolean
          description: 始终为 true。服务即将退出，由客户端重新拉起。
    SendMessageRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          description: 用户输入。服务端去掉首尾空白后不能为空。
        requestId:
          type: string
          description: 幂等键。缺省时服务端生成。同一个 requestId 重复提交返回同一个 runId。
    ContinueRequest:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          description: 幂等键。缺省时服务端生成。同一个 requestId 重复提交返回同一个 runId。
    RunAccepted:
      type: object
      additionalProperties: false
      required:
        - runId
      properties:
        runId:
          type: string
          description: Pi Durable 这次提交的 id
    StopAccepted:
      type: object
      additionalProperties: false
      required:
        - stopping
      properties:
        stopping:
          type: boolean
          description: 始终为 true。
    SubagentMessageAccepted:
      type: object
      additionalProperties: false
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: 始终为 true。
    ToolOutput:
      type: object
      additionalProperties: false
      required:
        - id
        - text
        - totalLines
      properties:
        id:
          type: string
        text:
          type: string
          description: 完整输出。工作区绝对路径已换成相对路径。
        totalLines:
          type: integer
          description: 完整输出的行数
    ServiceDiscovery:
      type: object
      additionalProperties: false
      required:
        - protocolVersion
        - serviceVersion
        - pid
        - port
        - startedAt
        - token
      properties:
        protocolVersion:
          type: string
        serviceVersion:
          type: string
        pid:
          type: integer
        port:
          type: integer
          description: 服务实际监听的端口
        startedAt:
          type: integer
          description: 进程启动时间（毫秒时间戳）
        token:
          type: string
          description: 本机令牌。只存在内存和本文件，服务每次启动轮换
      description: 数据目录里的发现文件 `<dataDir>/service.json`，不对应 HTTP 接口。
    WebCode:
      type: object
      additionalProperties: false
      required:
        - code
        - expiresAt
      properties:
        code:
          type: string
        expiresAt:
          type: integer
          description: 过期时间（毫秒时间戳）
    V2Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
    Device:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - platform
        - createdAt
        - lastSeenAt
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        createdAt:
          type: integer
          description: 创建时间（毫秒时间戳）
        lastSeenAt:
          type: integer
          description: 最近出现时间（毫秒时间戳）
      description: 远程设备。契约先定义形状，实现以后再做。
    PairingRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - deviceName
        - platform
      properties:
        code:
          type: string
        deviceName:
          type: string
        platform:
          type: string
      description: 设备配对请求。契约先定义形状，实现以后再做。
    EntityRef:
      type: object
      additionalProperties: false
      required:
        - topic
        - entity
        - id
        - value
      properties:
        topic:
          type: string
        entity:
          type: string
        id:
          type: string
        value:
          type: object
          additionalProperties: true
          description: 各主题的实体类型以后各自定义
      description: 快照里的一条实体。SSE event=snapshot 的 entities 项。
    SnapshotEvent:
      type: object
      additionalProperties: false
      required:
        - protocolVersion
        - topics
        - entities
      properties:
        protocolVersion:
          type: string
        topics:
          type: array
          items:
            type: string
        entities:
          type: array
          items:
            $ref: "#/components/schemas/EntityRef"
        missing:
          type: array
          items:
            type: string
          description: 已订阅但快照阶段发现不存在的主题（例如 conversation:<id> 对应的对话不存在）。空则省略。
      description: SSE event=snapshot 的 data。连接时或续传补不上时发送；SSE id 为开始计算快照时的最新序号，计算期间到达的事件在快照之后按序补发。订阅不存在的 conversation:<id> 时 entities 为空，并列出 missing。
    UpsertEvent:
      type: object
      additionalProperties: false
      required:
        - topic
        - entity
        - id
        - value
      properties:
        topic:
          type: string
        entity:
          type: string
        id:
          type: string
        value:
          type: object
          additionalProperties: true
          description: 各主题的实体类型以后各自定义
      description: SSE event=upsert 的 data。实体整个替换，客户端按 id 覆盖。
    RemoveEvent:
      type: object
      additionalProperties: false
      required:
        - topic
        - entity
        - id
      properties:
        topic:
          type: string
        entity:
          type: string
        id:
          type: string
      description: SSE event=remove 的 data。实体删除。
    TextDeltaEvent:
      type: object
      additionalProperties: false
      required:
        - topic
        - itemId
        - offset
        - append
      properties:
        topic:
          type: string
        itemId:
          type: string
        offset:
          type: integer
        append:
          type: string
      description: SSE event=text.delta 的 data。只用于流式文字。offset 是追加前的长度。offset 等于当前长度时追加；现有文字从 offset 起已等于 append 时视为已应用、忽略；其他对不上的情况客户端丢掉本地内容，等下一次 upsert。
    HeartbeatEvent:
      type: object
      additionalProperties: false
      description: SSE event=heartbeat 的 data。不带 id，不进环形缓冲。
    ToolCall:
      type: object
      additionalProperties: false
      required:
        - id
        - groupId
        - kind
        - status
        - heading
        - hint
        - failure
        - diff
        - output
      properties:
        id:
          type: string
        groupId:
          type: string
          description: 所属工具组 id，由组内第一条调用算出
        kind:
          type: string
          enum:
            - read
            - write
            - edit
            - ls
            - grep
            - bash
            - other
        status:
          type: string
          enum:
            - running
            - failed
            - interrupted
            - done
        heading:
          type: object
          additionalProperties: false
          required:
            - title
            - detail
            - fromIntent
          properties:
            title:
              type: string
            detail:
              type: string
            fromIntent:
              type: boolean
              description: title 是否来自 input.description
        path:
          type: string
          description: 相对工作区路径。没有则省略
        hint:
          type: object
          additionalProperties: false
          required:
            - text
            - failed
          properties:
            text:
              type: string
            failed:
              type: boolean
        failure:
          type: string
          enum:
            - none
            - probe
            - real
        diff:
          description: 没有增删行数时为 null
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - added
                - removed
              properties:
                added:
                  type:
                    - integer
                    - "null"
                removed:
                  type:
                    - integer
                    - "null"
        exitCode:
          type: integer
          description: bash 有退出码时带上，否则省略
        output:
          type: object
          additionalProperties: false
          required:
            - preview
            - truncated
            - totalLines
          properties:
            preview:
              type: string
              description: 成功取前 20 行，失败取 TOOL_ERROR_PREVIEW_LINES 行
            truncated:
              type: boolean
            totalLines:
              type: integer
      description: 单条工具调用的视图模型。全文按需拉 GET /api/v2/tools/<id>/output。
    ToolGroupSummary:
      type: object
      additionalProperties: false
      required:
        - text
        - failed
        - running
      properties:
        text:
          type: string
          description: 按客户端语言出成的摘要句子
        failed:
          type: integer
          description: 组内真实失败（不含试探失败）的条数
        running:
          type: boolean
      description: 工具组摘要。对应 ThreadItem.tool_group.summary。
    PathRef:
      type: object
      additionalProperties: false
      required:
        - text
        - path
      properties:
        text:
          type: string
          description: 行内代码的原文
        path:
          type: string
          description: 相对工作区的路径（统一用 /）
        line:
          type: integer
          minimum: 1
          description: 来自行内代码里的 :行号 后缀
      description: 行内代码里在工作区中真实存在的文件路径。各端渲染 Markdown 时把这些变成可点的标签。
    ContextUsage:
      type: object
      additionalProperties: false
      required:
        - used
        - window
        - percent
        - level
      properties:
        used:
          type: integer
          minimum: 0
          description: 已占用的上下文 token 数。没有用量时为 0
        window:
          type: integer
          minimum: 1
          description: 上下文窗口大小
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: 已用百分比，四舍五入，上限 100
        level:
          type: string
          enum:
            - ok
            - warn
            - full
          description: percent < 80 为 ok，80 到 94 为 warn，≥ 95 为 full
      description: 上下文用量视图。窗口由调用方传入（手动覆盖 → Provider 默认 → 模型目录 → 环境变量）；缺省 128000。
    ThreadItemUser:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - text
        - pathRefs
      properties:
        kind:
          type: string
          const: user
        id:
          type: string
        text:
          type: string
          description: Markdown 原文
        pathRefs:
          type: array
          items:
            $ref: "#/components/schemas/PathRef"
      description: 用户消息。
    ThreadItemAssistant:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - text
        - pathRefs
        - streaming
        - truncated
      properties:
        kind:
          type: string
          const: assistant
        id:
          type: string
        text:
          type: string
          description: Markdown 原文
        pathRefs:
          type: array
          items:
            $ref: "#/components/schemas/PathRef"
        model:
          type: string
          description: 这条回复用的模型 id。没有则省略
        streaming:
          type: boolean
        truncated:
          type: boolean
          description: 最后一条可见回复且 stopReason 为 length 时为 true，客户端显示继续
      description: 助手回复。空文字的助手消息不进入对话流。
    ThreadItemToolGroup:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - toolIds
        - summary
        - live
      properties:
        kind:
          type: string
          const: tool_group
        id:
          type: string
          description: 工具组 id，等于 toolGroupKey
        toolIds:
          type: array
          items:
            type: string
          description: 组内 ToolCall id，按出现顺序
        summary:
          $ref: "#/components/schemas/ToolGroupSummary"
        live:
          type: boolean
          description: 它是对话流最后一项且对话正在运行时为 true
      description: 连续工具调用合成的一组。
    ThreadItemSubagentReport:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - subagentId
        - name
        - reportKind
        - body
      properties:
        kind:
          type: string
          const: subagent_report
        id:
          type: string
        subagentId:
          description: 按 name 找到的子 Agent id；找不到为 null
          oneOf:
            - type: "null"
            - type: string
        name:
          type: string
        reportKind:
          type: string
          enum:
            - answered
            - failed
        body:
          type: string
      description: 子 Agent 汇报。存成用户输入，界面不画成用户气泡。
    ThreadItemSystemNote:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - noteKind
        - text
      properties:
        kind:
          type: string
          const: system_note
        id:
          type: string
        noteKind:
          type: string
          enum:
            - auto_continue
            - correction
            - note
        text:
          type: string
      description: 系统提示。auto_continue 的 text 是服务端出成的句子。
    ThreadItem:
      oneOf:
        - $ref: "#/components/schemas/ThreadItemUser"
        - $ref: "#/components/schemas/ThreadItemAssistant"
        - $ref: "#/components/schemas/ThreadItemToolGroup"
        - $ref: "#/components/schemas/ThreadItemSubagentReport"
        - $ref: "#/components/schemas/ThreadItemSystemNote"
      discriminator:
        propertyName: kind
        mapping:
          user: "#/components/schemas/ThreadItemUser"
          assistant: "#/components/schemas/ThreadItemAssistant"
          tool_group: "#/components/schemas/ThreadItemToolGroup"
          subagent_report: "#/components/schemas/ThreadItemSubagentReport"
          system_note: "#/components/schemas/ThreadItemSystemNote"
      description: 对话流里的一项。按 kind 区分。
    RunState:
      type: object
      additionalProperties: false
      required:
        - status
        - startedAt
        - pendingText
        - canSend
        - canStop
        - lockedReason
        - error
      properties:
        status:
          type: string
          enum:
            - idle
            - running
            - waiting
            - failed
            - stopped
          description: present() 状态归一。recovering、resuming 算 running；paused 算 waiting；error 算 failed；done 算 idle
        startedAt:
          description: 这次运行的开始时间（毫秒）。Harness 提交记录没有该字段时为 null
          oneOf:
            - type: "null"
            - type: integer
        pendingText:
          description: running 时的等待句子，其它状态为 null
          oneOf:
            - type: "null"
            - type: string
        canSend:
          type: boolean
          description: 有工作区时为 true。运行中也能发，会作为插话
        canStop:
          type: boolean
          description: running 时为 true
        lockedReason:
          description: 没有工作区时为 no_workspace，否则 null
          oneOf:
            - type: "null"
            - type: string
              const: no_workspace
        error:
          description: status 为 failed 时带上，否则 null
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - code
                - message
              properties:
                code:
                  type: string
                message:
                  type: string
                retry:
                  type: object
                  additionalProperties: false
                  required:
                    - attempt
                    - delayMs
                  properties:
                    attempt:
                      type: integer
                    delayMs:
                      type: integer
      description: 当前运行状态。供输入框、停止按钮和等待提示使用。
    ConversationModel:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - modelId
        - label
      properties:
        sourceId:
          type: string
        modelId:
          type: string
        label:
          type: string
          description: 先用 modelId
      description: 对话当前模型。取对话自己选的或默认模型。
    ProviderAccess:
      type: string
      enum:
        - api_key
        - account
        - local
        - custom_endpoint
        - agent
      description: agent 只在契约里预留，当前实现不会返回。
    ProviderStatus:
      type: string
      enum:
        - ok
        - needs_auth
        - unreachable
        - error
        - untested
    ProviderModel:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - brand
        - contextWindow
        - contextWindowCustom
      properties:
        id:
          type: string
        displayName:
          type: string
          description: 按品牌表算出的显示名；认不出品牌时等于 id
        brand:
          description: 品牌 id，认不出为 null
          oneOf:
            - type: "null"
            - type: string
        contextWindow:
          type: integer
          description: 手动覆盖 → 模型目录 → 环境变量
        contextWindowCustom:
          type: boolean
          description: true 表示用户手动覆盖
      description: Provider 上的一个可用模型。
    Provider:
      type: object
      additionalProperties: false
      required:
        - id
        - vendor
        - name
        - access
        - runtime
        - baseUrl
        - keyMasked
        - hasKey
        - status
        - statusText
        - lastTestedAt
        - models
        - isDefault
      properties:
        id:
          type: string
        vendor:
          description: 品牌 id，认不出为 null
          oneOf:
            - type: "null"
            - type: string
        name:
          type: string
        access:
          $ref: "#/components/schemas/ProviderAccess"
        runtime:
          type: string
          enum:
            - model
            - agent
          description: 当前实现恒为 model。agent 只在契约里预留。
        baseUrl:
          type: string
        keyMasked:
          description: 没有 key 时为 null。永远不是明文
          oneOf:
            - type: "null"
            - type: string
        hasKey:
          type: boolean
        status:
          $ref: "#/components/schemas/ProviderStatus"
        statusText:
          type: string
          description: 服务端按 lang 出成句。ok / untested 时为空字符串
        lastTestedAt:
          description: 最近一次探测时间（毫秒）。从未探测为 null
          oneOf:
            - type: "null"
            - type: integer
        models:
          type: array
          items:
            $ref: "#/components/schemas/ProviderModel"
        isDefault:
          type: boolean
      description: 模型来源的视图。响应和日志都不含明文 API key。
    Vendor:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - access
        - needsKey
        - baseUrl
        - brand
      properties:
        id:
          type: string
        name:
          type: string
        access:
          $ref: "#/components/schemas/ProviderAccess"
        needsKey:
          type: boolean
        baseUrl:
          type: string
          description: 预设默认地址。custom 为空字符串
        brand:
          description: 品牌 id，认不出为 null
          oneOf:
            - type: "null"
            - type: string
      description: 可添加的厂商预设（VENDOR_PRESETS）。不含 Grok。
    ResolvedModel:
      type: object
      additionalProperties: false
      required:
        - providerId
        - modelId
      properties:
        providerId:
          type: string
        modelId:
          type: string
      description: 对话或默认绑定的 Provider + 模型。
    ProvidersSnapshot:
      type: object
      additionalProperties: false
      required:
        - providers
        - vendors
        - defaultModel
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/Provider"
        vendors:
          type: array
          items:
            $ref: "#/components/schemas/Vendor"
        defaultModel:
          description: 当前默认模型。没有则为 null
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ResolvedModel"
      description: GET /api/v2/providers 的响应。
    ProviderDefaults:
      type: object
      additionalProperties: false
      required:
        - model
      properties:
        model:
          description: 当前默认模型。没有则为 null
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ResolvedModel"
      description: providers 主题里 defaults/self 实体的值。
    CreateProviderRequest:
      type: object
      additionalProperties: false
      required:
        - vendor
      properties:
        vendor:
          type: string
        name:
          type: string
        baseUrl:
          type: string
        apiKey:
          type: string
        models:
          type: array
          items:
            type: string
      description: 创建 API Provider。规则同旧 POST /api/sources。
    PatchProviderRequest:
      type: object
      additionalProperties: false
      properties:
        vendor:
          type: string
        name:
          type: string
        baseUrl:
          type: string
        apiKey:
          type: string
        models:
          type: array
          items:
            type: string
        defaultModel:
          description: 把该 Provider 上的这个模型设为默认；null 且当前默认就是它时清空默认
          oneOf:
            - type: "null"
            - type: string
      description: 修改已保存的 Provider。applySourcePatch 规则。
    TestProviderRequest:
      type: object
      additionalProperties: false
      required:
        - vendor
      properties:
        vendor:
          type: string
        baseUrl:
          type: string
        apiKey:
          type: string
      description: 未保存配置的连通性测试。请求只发往这里的 baseUrl（或 vendor 预设地址）。
    ProviderProbeResult:
      type: object
      additionalProperties: false
      required:
        - ok
        - models
        - status
        - statusText
      properties:
        ok:
          type: boolean
        models:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ProviderStatus"
        statusText:
          type: string
      description: 未保存配置的探测结果。失败时 models 为空数组。
    ContextWindowRequest:
      type: object
      additionalProperties: false
      required:
        - window
      properties:
        window:
          description: 新的上下文上限；null 恢复默认。整数范围 1000–10000000
          oneOf:
            - type: "null"
            - type: integer
              minimum: 1000
              maximum: 10000000
    ProviderRemoved:
      type: object
      additionalProperties: false
      required:
        - removed
      properties:
        removed:
          type: boolean
          const: true
      description: DELETE /api/v2/providers/{id} 成功。
    PatchConversationModelRequest:
      type: object
      additionalProperties: false
      required:
        - model
      properties:
        model:
          description: 绑定的模型；null 回到默认
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ResolvedModel"
      description: PATCH /api/v2/conversations/{id} 的请求体。
    GrokPending:
      type: object
      additionalProperties: false
      required:
        - loginId
        - verificationUri
        - userCode
        - interval
        - expiresAt
      properties:
        loginId:
          type: string
        verificationUri:
          type: string
        userCode:
          type: string
        interval:
          type: integer
          description: 建议轮询间隔（秒）
        expiresAt:
          type: integer
          description: 设备码过期时间（毫秒）
      description: 进行中的设备码登录。
    GrokSession:
      type: object
      additionalProperties: false
      required:
        - signedIn
        - account
        - email
        - expiresAt
        - authMode
        - source
        - pending
      properties:
        signedIn:
          type: boolean
        account:
          oneOf:
            - type: "null"
            - type: string
        email:
          oneOf:
            - type: "null"
            - type: string
        expiresAt:
          description: 会话过期时间（毫秒）。未登录为 null
          oneOf:
            - type: "null"
            - type: integer
        authMode:
          oneOf:
            - type: "null"
            - type: string
        source:
          oneOf:
            - type: "null"
            - type: string
        pending:
          description: 进行中的设备码登录。没有则为 null
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/GrokPending"
      description: Grok Build 会话。不含 access / refresh token。
    GrokLoginStart:
      $ref: "#/components/schemas/GrokPending"
    GrokLoginPollRequest:
      type: object
      additionalProperties: false
      required:
        - loginId
      properties:
        loginId:
          type: string
    GrokLoginCancelRequest:
      type: object
      additionalProperties: false
      properties:
        loginId:
          type: string
    GrokLoginPending:
      type: object
      additionalProperties: false
      required:
        - status
        - interval
        - expiresAt
      properties:
        status:
          type: string
          const: pending
        interval:
          type: integer
        expiresAt:
          type: integer
          description: 设备码过期时间（毫秒）
    GrokLoginDone:
      type: object
      additionalProperties: false
      required:
        - status
        - grok
      properties:
        status:
          type: string
          const: done
        grok:
          $ref: "#/components/schemas/GrokSession"
    GrokLoginPollResult:
      oneOf:
        - $ref: "#/components/schemas/GrokLoginPending"
        - $ref: "#/components/schemas/GrokLoginDone"
    Workspace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - path
        - source
        - gitUrl
        - branch
        - git
        - conversationCount
        - runningCount
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        source:
          type: string
          enum:
            - local
            - git
        gitUrl:
          description: Git 导入时去掉凭据后的仓库地址。本地工作区为 null
          oneOf:
            - type: "null"
            - type: string
        branch:
          description: Git 导入时的分支。本地工作区或未指定分支为 null
          oneOf:
            - type: "null"
            - type: string
        git:
          description: 工作区当前 git 状态。不是 git 仓库或未安装 git 时为 null
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/GitStatus"
        conversationCount:
          type: integer
          minimum: 0
          description: 该工作区下的对话数
        runningCount:
          type: integer
          minimum: 0
          description: 状态为 running 的对话数（recovering、resuming 算 running）
      description: 侧栏工作区。
    GitStatus:
      type: object
      additionalProperties: false
      required:
        - branch
        - detached
        - changedFiles
        - insertions
        - deletions
        - ahead
        - behind
      properties:
        branch:
          type: string
          description: 当前分支名。detached HEAD 时为短 sha
        detached:
          type: boolean
          description: detached HEAD 时为 true
        changedFiles:
          type: integer
          minimum: 0
          description: 未提交改动的文件数，含未跟踪的文件
        insertions:
          type: integer
          minimum: 0
          description: 相对 HEAD 的未提交插入行数（git diff --numstat HEAD；二进制不计）
        deletions:
          type: integer
          minimum: 0
          description: 相对 HEAD 的未提交删除行数（git diff --numstat HEAD；二进制不计）
        ahead:
          description: 领先上游的提交数。没有上游时为 null
          oneOf:
            - type: "null"
            - type: integer
              minimum: 0
        behind:
          description: 落后上游的提交数。没有上游时为 null
          oneOf:
            - type: "null"
            - type: integer
              minimum: 0
      description: 工作区实时 git 状态。
    SubagentCounts:
      type: object
      additionalProperties: false
      required:
        - total
        - live
      properties:
        total:
          type: integer
          minimum: 0
        live:
          type: integer
          minimum: 0
      description: 子 Agent 总数和正在跑的数量。没有子 Agent 时 ConversationSummary.subagents 为 null。
    ConversationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - title
        - updatedAt
        - status
        - runningAgents
        - subagents
        - archived
      properties:
        id:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        updatedAt:
          type: integer
          description: 毫秒时间戳
        status:
          type: string
          enum:
            - idle
            - running
            - waiting
            - failed
          description: 按设计 6.1 归一。recovering、resuming 算 running；paused 算 waiting；error 算 failed；stopped 算 idle
        runningAgents:
          type: integer
          minimum: 0
          description: 主 Agent 运行算 1，加上运行中的子 Agent 数。与旧版 conversationMeta「N 个 Agent 运行中」一致
        subagents:
          description: 没有子 Agent 时为 null
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SubagentCounts"
        archived:
          type: boolean
      description: 侧栏对话摘要。
    WorkspacesSnapshot:
      type: object
      additionalProperties: false
      required:
        - workspaces
        - conversations
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
          description: 每个工作区下的对话按 updatedAt 倒序，再按工作区列表顺序拼接
      description: GET /api/v2/workspaces 的响应。
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
      description: 新建对话。title 缺省为 New conversation。
    WorkspaceRemoved:
      type: object
      additionalProperties: false
      required:
        - removed
      properties:
        removed:
          type: boolean
          const: true
      description: DELETE /api/v2/workspaces/{id} 成功。
    WorkspaceBusy:
      type: object
      additionalProperties: false
      required:
        - error
        - code
        - conversations
      properties:
        error:
          type: string
        code:
          type: string
          const: E_WS_BUSY
        conversations:
          type: array
          items:
            type: string
          description: 正在运行、因此挡住移除的对话 id
      description: 工作区里还有运行中的对话。
    ConversationView:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - title
        - updatedAt
        - status
        - model
        - run
        - context
        - itemIds
      properties:
        id:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        updatedAt:
          type: integer
          description: 毫秒时间戳
        status:
          type: string
          enum:
            - idle
            - running
            - waiting
            - failed
          description: 按设计 6.1 归一。stopped 算 idle
        model:
          description: 解析不到时为 null
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ConversationModel"
        run:
          $ref: "#/components/schemas/RunState"
        context:
          $ref: "#/components/schemas/ContextUsage"
        itemIds:
          type: array
          items:
            type: string
          description: 对话流 ThreadItem id 的顺序
        sends:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSend"
          description: |
            本进程内经 POST .../messages 与 .../continue 发出的提交，按先后顺序，最多保留最近 20 条。
            前端用 requestId 找到自己那条乐观上屏的消息落在哪个 entry 上，据此收回。只在写入它们的服务进程内存在。
      description: 一个对话的视图。摘要字段加上模型、运行状态、上下文和对话流顺序。
    ConversationSend:
      type: object
      additionalProperties: false
      required:
        - requestId
        - entryId
        - dropped
      properties:
        requestId:
          type: string
          description: 发送时带的幂等键（POST 请求体的 requestId）。
        entryId:
          description: |
            内核把这条输入写进对话后的 entry id，也就是对应 ThreadItem 的 id（user 气泡、subagent 报告卡片或系统提示都可能）。
            这条输入还在队列里、没有落盘时为 null。
          oneOf:
            - type: "null"
            - type: string
        dropped:
          type: boolean
          description: |
            这条输入被撤回、丢弃或提交失败，对话里不会再有对应条目（只在 entryId 为 null 时有意义）。
            服务端查到 entryId 之后就不再回查提交记录，所以 entryId 不为 null 时该值可能仍是 false。
      description: 一次发送在对话里的落点，供前端按 requestId 收回乐观上屏的消息。
    ConversationSnapshot:
      type: object
      additionalProperties: false
      required:
        - conversation
        - items
        - tools
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationView"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ThreadItem"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
      description: GET /api/v2/conversations/{id} 的响应。客户端按 itemIds 画对话流，按 toolIds 取工具行。
    Subagent:
      type: object
      additionalProperties: false
      required:
        - id
        - parentConversationId
        - title
        - name
        - mode
        - status
        - startedAt
        - lastActivityAt
        - endedAt
        - currentAction
        - progress
      properties:
        id:
          type: string
          description: 子 Agent id，形如 `<cid>:sub:<子对话 id>`
        parentConversationId:
          type: string
          description: 所属主对话 id
        title:
          type: string
          description: 按 title → name（空或默认名如 agent-1 则跳过）→ brief 第一行 → lastText 回退
        name:
          type: string
        mode:
          type: string
          enum:
            - foreground
            - background
        status:
          type: string
          enum:
            - waiting
            - running
            - stuck
            - done
            - stopped
            - failed
          description: kernel 的 error 归为 failed。running 且超过 stuckAfterMs 没有活动则为 stuck
        startedAt:
          description: 开始时间（毫秒）。没有则为 null
          oneOf:
            - type: "null"
            - type: integer
        lastActivityAt:
          description: 最近活动时间（毫秒）。没有则为 null
          oneOf:
            - type: "null"
            - type: integer
        endedAt:
          description: 结束时间（毫秒）。未结束则为 null
          oneOf:
            - type: "null"
            - type: integer
        currentAction:
          description: 正在做的事。非 running/stuck 或没有则为 null
          oneOf:
            - type: "null"
            - type: string
        progress:
          description: 步数。没有 step/total 则为 null
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - step
                - total
              properties:
                step:
                  type: number
                total:
                  type: number
      description: 侧栏和子线程里的子 Agent 视图。卡住由服务端判定。
    SubagentSnapshot:
      type: object
      additionalProperties: false
      required:
        - subagent
        - items
        - tools
      properties:
        subagent:
          $ref: "#/components/schemas/Subagent"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ThreadItem"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
      description: GET /api/v2/conversations/{id}/subagents/{agentId} 的响应。
    Change:
      type: object
      additionalProperties: false
      required:
        - path
        - added
        - removed
        - error
      properties:
        path:
          type: string
          description: 相对工作区的路径，统一用 `/`
        added:
          type: integer
        removed:
          type: integer
        error:
          description: 例如文件过大。没有则为 null
          oneOf:
            - type: "null"
            - type: string
      description: 对话右栏变更列表的一项。SSE conversation 主题里 entity=change，id 为 path。
    DiffLine:
      type: object
      additionalProperties: false
      required:
        - op
        - text
        - oldLine
        - newLine
      properties:
        op:
          type: string
          enum:
            - ctx
            - add
            - del
        text:
          type: string
          description: 不含换行符的一行
        oldLine:
          description: 旧文件行号（1 起）。add 为 null
          oneOf:
            - type: "null"
            - type: integer
        newLine:
          description: 新文件行号（1 起）。del 为 null
          oneOf:
            - type: "null"
            - type: integer
    DiffHunk:
      type: object
      additionalProperties: false
      required:
        - oldStart
        - oldLines
        - newStart
        - newLines
        - lines
      properties:
        oldStart:
          type: integer
        oldLines:
          type: integer
        newStart:
          type: integer
        newLines:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DiffLine"
    Diff:
      type: object
      additionalProperties: false
      required:
        - path
        - added
        - removed
        - hunks
        - tooLarge
      properties:
        path:
          type: string
          description: 相对工作区的路径，统一用 `/`
        added:
          type: integer
        removed:
          type: integer
        hunks:
          type: array
          items:
            $ref: "#/components/schemas/DiffHunk"
        tooLarge:
          type: boolean
          description: 文件过大时为 true，此时 hunks 为空
      description: GET /api/v2/conversations/{id}/diff 的响应。
    FileNode:
      type: object
      additionalProperties: false
      required:
        - path
        - type
      properties:
        path:
          type: string
          description: 相对工作区的路径，统一用 `/`
        type:
          type: string
          enum:
            - file
            - dir
      description: 工作区文件树的一项。
    FileTree:
      type: object
      additionalProperties: false
      required:
        - entries
        - truncated
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileNode"
        truncated:
          type: boolean
          description: 达到 500 条上限时为 true
      description: GET /api/v2/workspaces/{id}/tree 的响应。
    FileContent:
      type: object
      additionalProperties: false
      required:
        - path
        - size
        - binary
        - tooLarge
        - text
        - version
      properties:
        path:
          type: string
          description: 相对工作区的路径，统一用 `/`
        size:
          type: integer
          description: 字节数
        binary:
          type: boolean
        tooLarge:
          type: boolean
        text:
          description: 文本内容。binary 或 tooLarge 时为 null
          oneOf:
            - type: "null"
            - type: string
        version:
          type: string
          description: 内容 sha256 十六进制前 16 位
      description: GET /api/v2/workspaces/{id}/files 的响应。
    SaveFileRequest:
      type: object
      additionalProperties: false
      required:
        - path
        - text
      properties:
        path:
          type: string
        text:
          type: string
        baseVersion:
          type: string
          description: 上次读到的 version。带了且与磁盘当前不同则 409，不写入
      description: PUT /api/v2/workspaces/{id}/files 的请求体。
    SaveResult:
      type: object
      additionalProperties: false
      required:
        - path
        - version
        - added
        - removed
      properties:
        path:
          type: string
        version:
          type: string
        added:
          type: integer
        removed:
          type: integer
      description: PUT /api/v2/workspaces/{id}/files 成功。
    FileConflict:
      type: object
      additionalProperties: false
      required:
        - error
        - code
        - current
      properties:
        error:
          type: string
        code:
          type: string
          const: E_CONFLICT
        current:
          $ref: "#/components/schemas/FileContent"
      description: 保存时 baseVersion 过期。
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - source
      properties:
        name:
          type: string
        source:
          type: string
          enum:
            - local
            - git
        path:
          type: string
          description: source=local 时的本机目录。缺省则在数据目录下建空目录
        gitUrl:
          type: string
          description: source=git 时的仓库地址
        branch:
          type: string
        connectionId:
          type: string
        projectId:
          description: GitLab 项目 id，需同时带 connectionId
          oneOf:
            - type: string
            - type: integer
      description: POST /api/v2/workspaces 的请求体。
    WorkspaceCreateError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: 按 lang 出成句
        code:
          type: string
        allowedRoot:
          type: string
        detail:
          type: string
        via:
          type: string
      description: 新建工作区失败。路径越界带 allowedRoot；Git 失败带 code / via。
    GitCloneFailure:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: 按 lang 出成句
        code:
          type: string
          description: git_not_found、auth_failed、cert_failed 等，与旧接口相同
        detail:
          type: string
        via:
          type: string
      description: Git 克隆或 GitLab API 失败。
    WorkspaceRoot:
      type: object
      additionalProperties: false
      required:
        - root
      properties:
        root:
          type: string
      description: GET /api/v2/workspace-root。
    WorkspaceDirs:
      type: object
      additionalProperties: false
      required:
        - root
        - path
        - parent
        - selectable
        - git
        - entries
        - truncated
      properties:
        root:
          type: string
        path:
          type: string
        parent:
          description: 已在根目录时为 null
          oneOf:
            - type: "null"
            - type: string
        selectable:
          type: boolean
        git:
          type: boolean
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceDirEntry"
        truncated:
          type: boolean
      description: GET /api/v2/workspace-root/dirs。
    WorkspaceDirEntry:
      type: object
      additionalProperties: false
      required:
        - name
        - path
        - git
      properties:
        name:
          type: string
        path:
          type: string
        git:
          type: boolean
    PathNotAllowed:
      type: object
      additionalProperties: false
      required:
        - error
        - code
        - allowedRoot
      properties:
        error:
          type: string
          description: 按 lang 出成句
        code:
          type: string
          const: E_PATH
        allowedRoot:
          type: string
      description: 本地路径不在允许范围内。
    Plugin:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - version
        - source
        - enabled
        - loaded
        - error
        - errorCode
        - tools
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        source:
          type: string
        enabled:
          type: boolean
        loaded:
          type: boolean
        error:
          description: 失败原因成句。正常为 null
          oneOf:
            - type: "null"
            - type: string
        errorCode:
          description: 结构化失败码。正常为 null
          oneOf:
            - type: "null"
            - type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/PluginTool"
      description: 插件。失败原因由服务端按 lang 出成句。
    PluginTool:
      type: object
      additionalProperties: false
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
    PluginList:
      type: object
      additionalProperties: false
      required:
        - plugins
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/Plugin"
    InstallPluginRequest:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
      description: 本机插件目录。
    PatchPluginRequest:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
    Skill:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - version
        - source
        - enabled
        - deletable
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        source:
          type: string
        enabled:
          type: boolean
        deletable:
          type: boolean
      description: 技能。写失败时的原因在 CatalogError 里按 lang 出成句。
    SkillList:
      type: object
      additionalProperties: false
      required:
        - skills
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
    SkillWriteRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        body:
          type: string
        enabled:
          type: boolean
    CatalogError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: 按 lang 出成句
