  /api/v2/conversations/{id}/messages:
    post:
      operationId: postConversationMessage
      summary: 向对话发消息
      description: |
        空闲时发出去就是新一轮。运行中再发：默认 `mode: steer` 插话（Pi Durable `whenBusy: steer`，
        当前工具批次结束后写入对话）；`mode: queue` 排队（`whenBusy: followUp`，本轮结束后才作为新消息执行）。
        `text` 去掉首尾空白后，若没有 `images`、`files`、`pastes` 则不能为空。
        只有图片、文件或粘贴没有文字也可以发送。`files` 的 path 必须是该工作区 `.weft/uploads/` 下已存在的文件。
        `requestId` 缺省时服务端生成；同一个 requestId 重复请求返回同一个 runId。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 对话 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "202":
          description: 已接受，对话开始或继续运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"
        "400":
          description: 空文字且没有图片 / 文件 / 粘贴，或字段超限 / 格式不对 / 文件不在 uploads 下
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "404":
          description: 对话不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "409":
          description: 对话没有工作区
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        "413":
          description: 请求体过大（含图片的消息上限约 44MB）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        4XX:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
