                $ref: "#/components/schemas/V2Error"
        5XX:
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 发现文件里的本机令牌
    sessionCookie:
      type: apiKey
      in: cookie
      name: weft_session
      description: 网页端一次性码换来的会话 cookie
  schemas:
    ServiceInfo:
      type: object
      additionalProperties: false
      required:
        - protocolVersion
        - serviceVersion
        - pid
        - startedAt
        - demo
      properties:
        protocolVersion:
          type: string
        serviceVersion:
          type: string
        pid:
          type: integer
        startedAt:
          type: integer
          description: 进程启动时间（毫秒时间戳）
        demo:
          type: boolean
          description: 走本地剧本（WEFT_LLM=faux / LLM_API=faux / WEFT_FAUX_SCRIPT）时为 true，界面要标出「演示模型」
    RestartAccepted:
      type: object
      additionalProperties: false
      required:
        - exiting
      properties:
        exiting:
          type: boolean
          description: 始终为 true。服务即将退出，由客户端重新拉起。
    UploadRequest:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        name:
          type: string
          description: 原始文件名。服务端只取 basename，去掉控制字符和路径分隔符，空名用 file。
        data:
          type: string
          description: 原始字节的标准 base64，不含 data URL 前缀。
      description: POST /api/v2/workspaces/{id}/uploads 的请求体。
    UploadResult:
      type: object
      additionalProperties: false
      required:
        - path
        - name
        - bytes
        - mediaType
      properties:
        path:
          type: string
          description: 相对工作区的路径，正斜杠，形如 .weft/uploads/YYYYMMDD-HHmmss-xxxxxx/name
        name:
          type: string
          description: 清洗后的文件名
        bytes:
          type: integer
          minimum: 0
          description: 解码后的字节数
        mediaType:
          type: string
          description: 按扩展名猜测的 MIME，没有则 application/octet-stream
      description: 上传成功。
    SendMessageRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          description: 用户输入。去掉首尾空白后，若没有 images / files / pastes 则不能为空。
        images:
          type: array
          maxItems: 6
          description: >
            内联图片。data 是不带 data URL 前缀的标准 base64，mediaType 为 png / jpeg / gif / webp。
            单张解码后不超过 5MB，一条最多 6 张。选内联而不是先上传再拿 id，是因为
            Pi Durable 的 UserInput 原生就是 TextContent | ImageContent，图片进对话记录后刷新才能再显示。
          items:
            $ref: "#/components/schemas/MessageImage"
        files:
          type: array
          maxItems: 20
          description: >
            已上传到该工作区 `.weft/uploads/` 的文件。path 相对工作区、正斜杠，必须真实存在，
            否则 400 E_BAD_REQUEST。一条最多 20 个。服务端拼进一条 TextContent，模型用读文件工具去读。
          items:
            $ref: "#/components/schemas/SendMessageFile"
        pastes:
          type: array
          maxItems: 10
          description: >
            长粘贴原文。每段最多 1MB，一条最多 10 段。服务端存成独立的 TextContent
            （`<pasted_text lines="N">`），快照里只给元数据和前 8 行预览。
          items:
            type: string
        requestId:
          type: string
          description: 幂等键。缺省时服务端生成。同一个 requestId 重复提交返回同一个 runId。
        mode:
          type: string
          enum:
            - steer
            - queue
          description: |
            运行中再发时的处理方式。缺省为 steer（插话，`whenBusy: steer`）。
            queue 排队到本轮结束后再作为新消息执行（`whenBusy: followUp`）。空闲时两种都会立刻开始新一轮。
    MessageImage:
      type: object
      additionalProperties: false
      required:
        - mediaType
        - data
      properties:
        mediaType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/gif
            - image/webp
        data:
          type: string
          description: "原始字节的标准 base64，不含 data: 前缀。日志里不得打印。"
        name:
          type: string
          description: 原始文件名，仅供显示
      description: 发送时的一张图片。对话视图里不出现这个对象。
    SendMessageFile:
      type: object
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string
          description: 相对工作区的路径，必须在 .weft/uploads/ 下且文件存在
        name:
          type: string
          description: 显示名，缺省用 path 的 basename
        bytes:
          type: integer
          minimum: 0
          description: 可选；服务端以磁盘实际大小为准
      description: 发消息时引用的一个已上传文件。
    ThreadUserImage:
      type: object
      additionalProperties: false
      required:
        - index
        - mediaType
        - bytes
        - url
      properties:
        index:
          type: integer
          minimum: 0
          description: 这条用户消息里的第几张图，和取图接口的 index 一致
        mediaType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/gif
            - image/webp
        name:
          type: string
          description: 原始文件名，仅供显示
        bytes:
          type: integer
          minimum: 0
          description: 解码后的字节数，不含图片数据本身
        url:
          type: string
          description: >
            取这张图的地址。正式快照是 GET /api/v2/conversations/{id}/messages/{messageId}/images/{index}。
            乐观上屏还没有服务端地址时可以是 data: 或 blob: URL。
      description: 对话视图里的一张用户图片。只有元数据，不含 base64。
    ThreadUserPaste:
      type: object
      additionalProperties: false
      required:
        - lines
        - chars
        - preview
      properties:
        lines:
          type: integer
          minimum: 0
          description: 粘贴原文的行数
        chars:
          type: integer
          minimum: 0
          description: 粘贴原文的字符数
        preview:
          type: string
          description: 前 8 行预览。全文走 GET .../pastes/{index}
      description: 对话视图里的一段长粘贴。不含全文。
    ThreadUserFile:
      type: object
      additionalProperties: false
      required:
        - path
        - name
        - bytes
      properties:
        path:
          type: string
          description: 相对工作区的路径，正斜杠
        name:
          type: string
          description: 文件名，仅供显示
        bytes:
          type: integer
          minimum: 0
          description: 字节数
      description: 用户附上的一个文件。内容在工作区磁盘上，不进快照。
    ContinueRequest:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          description: 幂等键。缺省时服务端生成。同一个 requestId 重复提交返回同一个 runId。
    RunAccepted:
      type: object
      additionalProperties: false
      required:
        - runId
      properties:
        runId:
          type: string
          description: Pi Durable 这次提交的 id
    StopAccepted:
      type: object
      additionalProperties: false
      required:
        - stopping
      properties:
        stopping:
          type: boolean
          description: 始终为 true。
    WithdrawAccepted:
      type: object
      additionalProperties: false
      required:
        - ok
      properties:
        ok:
          type: boolean
          const: true
          description: 始终为 true。撤回成功。
    SubagentMessageAccepted:
      type: object
      additionalProperties: false
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: 始终为 true。
    ToolOutput:
      type: object
      additionalProperties: false
      required:
        - id
        - text
        - totalLines
      properties:
        id:
          type: string
        text:
          type: string
          description: 完整输出。工作区绝对路径已换成相对路径。
        totalLines:
          type: integer
          description: 完整输出的行数
    ServiceDiscovery:
      type: object
      additionalProperties: false
      required:
        - protocolVersion
        - serviceVersion
        - pid
        - port
        - startedAt
        - token
      properties:
        protocolVersion:
          type: string
        serviceVersion:
          type: string
        pid:
          type: integer
        port:
          type: integer
          description: 服务实际监听的端口
        startedAt:
          type: integer
          description: 进程启动时间（毫秒时间戳）
        token:
          type: string
          description: 本机令牌。只存在内存和本文件，服务每次启动轮换
      description: 数据目录里的发现文件 `<dataDir>/service.json`，不对应 HTTP 接口。
    WebCode:
      type: object
      additionalProperties: false
      required:
        - code
        - expiresAt
      properties:
        code:
          type: string
        expiresAt:
          type: integer
          description: 过期时间（毫秒时间戳）
    V2Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
    Device:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - platform
        - createdAt
        - lastSeenAt
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        createdAt:
          type: integer
          description: 创建时间（毫秒时间戳）
        lastSeenAt:
          type: integer
          description: 最近出现时间（毫秒时间戳）
      description: 远程设备。契约先定义形状，实现以后再做。
    PairingRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - deviceName
        - platform
      properties:
        code:
          type: string
        deviceName:
          type: string
        platform:
          type: string
      description: 设备配对请求。契约先定义形状，实现以后再做。
    EntityRef:
      type: object
      additionalProperties: false
      required:
        - topic
        - entity
        - id
        - value
      properties:
        topic:
          type: string
        entity:
          type: string
        id:
          type: string
        value:
          type: object
          additionalProperties: true
          description: 各主题的实体类型以后各自定义
      description: 快照里的一条实体。SSE event=snapshot 的 entities 项。
    SnapshotEvent:
      type: object
      additionalProperties: false
      required:
        - protocolVersion
        - topics
        - entities
      properties:
        protocolVersion:
          type: string
        topics:
          type: array
          items:
            type: string
        entities:
          type: array
          items:
            $ref: "#/components/schemas/EntityRef"
        missing:
          type: array
          items:
            type: string
          description: 已订阅但快照阶段发现不存在的主题（例如 conversation:<id> 对应的对话不存在）。空则省略。
      description: SSE event=snapshot 的 data。连接时或续传补不上时发送；SSE id 为开始计算快照时的最新序号，计算期间到达的事件在快照之后按序补发。订阅不存在的 conversation:<id> 时 entities 为空，并列出 missing。
    UpsertEvent:
      type: object
      additionalProperties: false
      required:
        - topic
        - entity
        - id
        - value
      properties:
        topic:
          type: string
        entity:
          type: string
        id:
          type: string
        value:
          type: object
          additionalProperties: true
          description: 各主题的实体类型以后各自定义
      description: SSE event=upsert 的 data。实体整个替换，客户端按 id 覆盖。
    RemoveEvent:
      type: object
      additionalProperties: false
      required:
        - topic
        - entity
        - id
      properties:
        topic:
          type: string
        entity:
          type: string
        id:
          type: string
      description: SSE event=remove 的 data。实体删除。
    TextDeltaEvent:
      type: object
      additionalProperties: false
      required:
        - topic
        - itemId
        - offset
        - append
      properties:
        topic:
          type: string
        itemId:
          type: string
        offset:
          type: integer
        append:
          type: string
      description: SSE event=text.delta 的 data。只用于流式文字。offset 是追加前的长度。offset 等于当前长度时追加；现有文字从 offset 起已等于 append 时视为已应用、忽略；其他对不上的情况客户端丢掉本地内容，等下一次 upsert。
    ToolDeltaEvent:
      type: object
      additionalProperties: false
      required:
        - topic
        - toolId
      properties:
        topic:
          type: string
        toolId:
          type: string
        set:
          type: string
          description: 整段替换保留窗口。与 append 互斥
        offset:
          type: integer
          description: 追加前的长度（已应用 trimStart 之后）。set 出现时省略
        append:
          type: string
          description: 追加的文本。set 出现时省略
        trimStart:
          type: integer
          description: 追加前从窗口头部丢掉的字符数
      description: SSE event=tool.delta 的 data。只用于工具输出（bash 保留窗口）。带 set 时整段替换；否则先按 trimStart 丢掉头部再按 offset 追加。offset 等于当前长度时追加；现有文字从 offset 起已等于 append 时视为已应用、忽略；其他对不上的情况客户端丢掉本地内容，等下一次 upsert。
    HeartbeatEvent:
      type: object
      additionalProperties: false
      description: SSE event=heartbeat 的 data。不带 id，不进环形缓冲。
    ToolCall:
      type: object
      additionalProperties: false
      required:
        - id
        - groupId
        - kind
        - status
        - heading
        - hint
        - failure
        - diff
        - output
      properties:
        id:
          type: string
        groupId:
          type: string
          description: 所属工具组 id，由组内第一条调用算出
        kind:
          type: string
          enum:
            - read
            - write
            - edit
            - ls
            - grep
            - bash
            - other
        status:
          type: string
          enum:
            - running
            - failed
            - interrupted
            - done
        heading:
          type: object
          additionalProperties: false
          required:
            - title
            - detail
            - fromIntent
          properties:
            title:
              type: string
            detail:
              type: string
            fromIntent:
              type: boolean
              description: title 是否来自 input.description
        path:
          type: string
          description: 相对工作区路径。没有则省略
        hint:
          type: object
          additionalProperties: false
          required:
            - text
            - failed
          properties:
            text:
              type: string
            failed:
              type: boolean
        failure:
          type: string
          enum:
            - none
            - probe
            - real
        diff:
          description: 没有增删行数时为 null
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - added
                - removed
              properties:
                added:
                  type:
                    - integer
                    - "null"
                removed:
                  type:
                    - integer
                    - "null"
        exitCode:
          type: integer
          description: bash 有退出码时带上，否则省略
        output:
          type: object
          additionalProperties: false
          required:
            - preview
            - truncated
            - totalLines
          properties:
            preview:
              type: string
              description: 成功取前 20 行，失败取 TOOL_ERROR_PREVIEW_LINES 行
            truncated:
              type: boolean
            totalLines:
              type: integer
            text:
              type: string
              description: Harness 保留的输出窗口（尾部）。运行中的 bash 或预览被截断时带上；省略则预览即全文
      description: 单条工具调用的视图模型。全文按需拉 GET /api/v2/conversations/{id}/tools/{toolId}/output。
    ToolGroupSummary:
      type: object
      additionalProperties: false
      required:
        - text
        - failed
        - running
      properties:
        text:
          type: string
          description: 按客户端语言出成的摘要句子
        failed:
          type: integer
          description: 组内真实失败（不含试探失败）的条数
        running:
          type: boolean
      description: 工具组摘要。对应 ThreadItem.tool_group.summary。
    PathRef:
      type: object
      additionalProperties: false
      required:
        - text
        - path
      properties:
        text:
          type: string
          description: 行内代码原文，或 Markdown 链接的 href 原文
        path:
          type: string
          description: 相对工作区的路径（统一用 /）
        line:
          type: integer
          minimum: 1
          description: 来自行内代码里的 :行号 后缀
      description: 行内代码里在工作区中真实存在的文件路径。各端渲染 Markdown 时把这些变成可点的标签。
    ContextUsage:
      type: object
      additionalProperties: false
      required:
        - used
        - window
        - percent
        - level
      properties:
        used:
          type: integer
          minimum: 0
          description: 已占用的上下文 token 数。没有用量时为 0
        window:
          type: integer
          minimum: 1
          description: 上下文窗口大小
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: 已用百分比，四舍五入，上限 100
        level:
          type: string
          enum:
            - ok
            - warn
            - full
          description: percent < 80 为 ok，80 到 94 为 warn，≥ 95 为 full
      description: 上下文用量视图。窗口由调用方传入（手动覆盖 → Provider 默认 → 模型目录 → 环境变量）；缺省 128000。
    ThreadItemUser:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - text
        - pathRefs
      properties:
        kind:
          type: string
          const: user
        id:
          type: string
        text:
          type: string
          description: Markdown 原文
        pathRefs:
          type: array
          items:
            $ref: "#/components/schemas/PathRef"
        images:
          type: array
          description: 这条用户消息里的图片元数据。没有则省略。不含图片数据。
          items:
            $ref: "#/components/schemas/ThreadUserImage"
        pastes:
          type: array
          description: 长粘贴元数据。没有则省略。不含粘贴全文。
          items:
            $ref: "#/components/schemas/ThreadUserPaste"
        files:
          type: array
          description: 附上的文件。没有则省略。path 相对工作区。
          items:
            $ref: "#/components/schemas/ThreadUserFile"
      description: 用户消息。text 只含用户正文，不含粘贴块和附件说明。
    ThreadItemAssistant:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - text
        - pathRefs
        - streaming
        - truncated
      properties:
        kind:
          type: string
          const: assistant
        id:
          type: string
        text:
          type: string
          description: Markdown 原文
        pathRefs:
          type: array
          items:
            $ref: "#/components/schemas/PathRef"
        model:
          type: string
          description: 这条回复用的模型 id。没有则省略
        streaming:
          type: boolean
        truncated:
          type: boolean
          description: 最后一条可见回复且 stopReason 为 length 时为 true，客户端显示继续
      description: 助手回复。空文字的助手消息不进入对话流。
    ThreadItemToolGroup:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - toolIds
        - summary
        - live
      properties:
        kind:
          type: string
          const: tool_group
        id:
          type: string
          description: 工具组 id，等于 toolGroupKey
        toolIds:
          type: array
          items:
            type: string
          description: 组内 ToolCall id，按出现顺序
        summary:
          $ref: "#/components/schemas/ToolGroupSummary"
        live:
          type: boolean
          description: 它是对话流最后一项且对话正在运行时为 true
      description: 连续工具调用合成的一组。
    ThreadItemSubagentReport:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - subagentId
        - name
        - reportKind
        - body
      properties:
        kind:
          type: string
          const: subagent_report
        id:
          type: string
        subagentId:
          description: 按 name 找到的子 Agent id；找不到为 null
          oneOf:
            - type: "null"
            - type: string
        name:
          type: string
        reportKind:
          type: string
          enum:
            - answered
            - failed
        body:
          type: string
      description: 子 Agent 汇报。存成用户输入，界面不画成用户气泡。
    ThreadItemSystemNote:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - noteKind
        - text
      properties:
        kind:
          type: string
          const: system_note
        id:
          type: string
        noteKind:
          type: string
          enum:
            - auto_continue
            - correction
            - note
        text:
          type: string
      description: 系统提示。auto_continue 的 text 是服务端出成的句子。
    ThreadItem:
      oneOf:
        - $ref: "#/components/schemas/ThreadItemUser"
        - $ref: "#/components/schemas/ThreadItemAssistant"
        - $ref: "#/components/schemas/ThreadItemToolGroup"
        - $ref: "#/components/schemas/ThreadItemSubagentReport"
        - $ref: "#/components/schemas/ThreadItemSystemNote"
      discriminator:
        propertyName: kind
        mapping:
          user: "#/components/schemas/ThreadItemUser"
          assistant: "#/components/schemas/ThreadItemAssistant"
          tool_group: "#/components/schemas/ThreadItemToolGroup"
          subagent_report: "#/components/schemas/ThreadItemSubagentReport"
          system_note: "#/components/schemas/ThreadItemSystemNote"
      description: 对话流里的一项。按 kind 区分。
    RunState:
      type: object
      additionalProperties: false
      required:
        - status
        - startedAt
        - pendingText
        - canSend
        - canStop
        - lockedReason
        - error
        - lastActivityAt
        - stalledSince
        - activeTool
      properties:
        status:
          type: string
          enum:
            - idle
            - running
            - waiting
            - failed
            - stopped
          description: present() 状态归一。recovering、resuming 算 running；paused 算 waiting；error 算 failed；done 算 idle
        startedAt:
          description: 这次运行的开始时间（毫秒）。Harness 提交记录没有该字段时为 null
          oneOf:
            - type: "null"
            - type: integer
        pendingText:
          description: running 时的等待句子，其它状态为 null
          oneOf:
            - type: "null"
            - type: string
        canSend:
          type: boolean
          description: 有工作区时为 true。运行中也能发，会作为插话
        canStop:
          type: boolean
          description: running 时为 true
        lockedReason:
          description: 没有工作区时为 no_workspace，否则 null
          oneOf:
            - type: "null"
            - type: string
              const: no_workspace
        error:
          description: status 为 failed 时带上，否则 null
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - code
                - message
              properties:
                code:
                  type: string
                message:
                  type: string
                retry:
                  type: object
                  additionalProperties: false
                  required:
                    - attempt
                    - delayMs
                  properties:
                    attempt:
                      type: integer
                    delayMs:
                      type: integer
        lastActivityAt:
          description: running 时最近一次内核活动时间（毫秒）。文字/思考片段、工具开始/结束/输出、消息结束都算活动。未在跑时为 null
          oneOf:
            - type: "null"
            - type: integer
        stalledSince:
          description: running 且 now − lastActivityAt 超过 stallAfterMs（默认 180000，可用 WEFT_MAIN_STALL_MS 改）时为 lastActivityAt，否则 null。等于阈值不算卡住
          oneOf:
            - type: "null"
            - type: integer
        activeTool:
          description: 当前正在运行（已 start 未 end）的工具，供界面显示「正在运行 npm test」。没有则为 null
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - name
                - startedAt
                - summary
              properties:
                name:
                  type: string
                  description: 工具名，例如 bash
                startedAt:
                  type: integer
                  description: 这次 tool.start 的时间（毫秒）
                summary:
                  type: string
                  description: 工具标题摘要，例如 bash 命令前 80 个字符
      description: 当前运行状态。供输入框、停止按钮、等待提示和主对话卡住判定使用。
    ConversationModel:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - modelId
        - label
      properties:
        sourceId:
          type: string
        modelId:
          type: string
        label:
          type: string
          description: 先用 modelId
      description: 对话当前模型。取对话自己选的或默认模型。
    ProviderAuthType:
      type: string
      enum:
