<div style="width: 1200px; height: 860px; box-sizing: border-box; padding: 30px; background: #8E8E8C; font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', system-ui, sans-serif; color: #1A1A1A; font-size: 14px">

      <div style="padding: 8px 10px">通用</div>
      <div style="padding: 8px 10px; background: #ECECE9; border-radius: 8px; color: #1A1A1A">Provider</div>

      <div style="padding: 8px 10px">插件</div>
      <div style="padding: 8px 10px">Skills</div>
      <div style="padding: 8px 10px">关于</div>

    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="padding: 26px 36px 0; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 18px">
            <span style="color: #6E6E6E">Provider</span>
            <span style="color: #B5B5B2">/</span>
            <span style="font-weight: 600">添加</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6E6E6E">
            <span style="display: inline-flex; align-items: center; gap: 6px; color: #1A1A1A; font-weight: 600"><span style="width: 18px; height: 18px; border-radius: 50%; background: #1A1A1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px">1</span>选厂商</span>
            <span style="width: 20px; height: 1px; background: #DCDCD9"></span>
            <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 18px; height: 18px; border-radius: 50%; border: 1px solid #CFCFCB; display: flex; align-items: center; justify-content: center; font-size: 11px">2</span>连接</span>
            <span style="width: 20px; height: 1px; background: #DCDCD9"></span>
            <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 18px; height: 18px; border-radius: 50%; border: 1px solid #CFCFCB; display: flex; align-items: center; justify-content: center; font-size: 11px">3</span>选模型</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px">
          <label style="width: 300px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #DCDCD9; border-radius: 10px; color: #6E6E6E; box-sizing: border-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <input aria-label="搜索 Provider" placeholder="搜索，比如 Claude、硅基流动" style="flex: 1; min-width: 0; border: none; outline: none; font-size: 14px; font-family: inherit; background: transparent">
          </label>
          <span style="font-size: 12px; color: #6E6E6E">先选厂商，下一步再选怎么接（账号登录、API Key、ACP Agent…）</span>
        </div>
      </div>

      <div style="flex: 1; min-height: 0; padding: 18px 36px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 48px; gap: 10px; align-content: start">
        <sc-for list="{{cards}}" as="p" hint-placeholder-count="20">
          <button type="button" style="display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 10px; border: {{p.border}}; background: {{p.bg}}; font-family: inherit; text-align: left; min-width: 0">
            <img src="{{p.icon}}" alt="" width="18" height="18" style="display: block; flex-shrink: 0">
            <span style="min-width: 0; display: flex; flex-direction: column; line-height: 1.35">
              <span style="font-size: 14px; color: #1A1A1A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
            </span>
          </button>
        </sc-for>
      </div>

      <div style="padding: 14px 36px; border-top: 1px solid #EFEFED; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #555555">
        <span style="display: flex; align-items: center; gap: 8px"><img src="/_blob/53bfe8f749ed95d49007d090442a7741" alt="" width="14" height="14" style="display: block">已选 Anthropic</span>
        <span style="display: flex; gap: 8px">
          <button type="button" style="height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid #DCDCD9; background: #FFFFFF; font-size: 13px; font-family: inherit; color: #1A1A1A">取消</button>
          <button type="button" style="height: 34px; padding: 0 16px; border-radius: 8px; border: none; background: #1A1A1A; color: #FFFFFF; font-size: 13px; font-family: inherit">下一步</button>
        </span>
      </div>
    </div>
  </div>
</div>
</x-dc>

    return {
      cards: [
        card('Anthropic', '/_blob/53bfe8f749ed95d49007d090442a7741', 3, true),

</script>
</body>
</html>
